<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsuralIQ — Insurance Knowledge Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal: #0E7C86;
  --teal-dark: #0A5A62;
  --teal-soft: #E4F1F1;
  --coral: #FF6B5B;
  --coral-soft: #FFEDE9;
  --bg: #FBFAF7;
  --card: #FFFFFF;
  --ink: #1A2B32;
  --sub: #5B6B70;
  --line: #ECE9E2;
  --font: 'Inter', system-ui, sans-serif;
  --display: 'Fraunces', Georgia, serif;
}

body {
  min-height: 100vh;
  background: #E9E6DE;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

/* ── Phone Frame ── */
.phone {
  width: 390px; height: 800px;
  background: var(--bg);
  border-radius: 42px;
  border: 10px solid #14232a;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 70px rgba(20,35,42,0.35);
}

.status-bar {
  height: 30px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; font: 600 12px var(--font); color: var(--ink);
}
.status-bar .brand { font: 700 14px var(--display); color: var(--teal); letter-spacing: -0.3px; }

.search-bar { padding: 4px 16px 8px; }
.search-bar-inner {
  display: flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
}
.search-bar-inner input {
  border: none; outline: none; font: 400 13.5px var(--font); color: var(--ink);
  background: none; flex: 1;
}
.search-bar-inner input::placeholder { color: var(--sub); }

.scroll-area {
  height: calc(800px - 30px - 46px - 64px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.scroll-area::-webkit-scrollbar { width: 0; }

/* ── Bottom Nav ── */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 64px; background: #fff; border-top: 1px solid var(--line); display: flex;
}
.tab-btn {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding-top: 9px; opacity: 0.5; transition: opacity 0.2s;
}
.tab-btn.active { opacity: 1; }
.tab-btn .tab-icon { font-size: 17px; }
.tab-btn:not(.active) .tab-icon { filter: grayscale(1); }
.tab-btn .tab-label { font: 500 10px var(--font); color: var(--sub); }
.tab-btn.active .tab-label { font-weight: 600; color: var(--teal); }

/* ── FAB ── */
.fab-ai {
  position: absolute; right: 16px; bottom: 78px;
  width: 52px; height: 52px; border-radius: 26px; border: none;
  background: var(--coral); color: #fff; font: 600 11px var(--font);
  cursor: pointer; box-shadow: 0 8px 20px rgba(255,107,91,0.45); z-index: 10;
}

/* ── Shared ── */
.back-btn { font: 600 13.5px var(--font); color: var(--teal); background: none; border: none; padding: 0; cursor: pointer; }
.pill { font: 600 10.5px var(--font); letter-spacing: 0.7px; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; display: inline-block; }
.section-label { font: 600 11px var(--font); letter-spacing: 1px; text-transform: uppercase; color: var(--teal); margin: 2px 0 7px; }
.section-label.accent { color: var(--coral); }
.body-text { font: 400 15px var(--font); color: var(--ink); line-height: 1.6; margin: 0 0 18px; }
.concept-chip { color: var(--coral); background: none; border: none; border-bottom: 1.5px dotted var(--coral); padding: 0; font: inherit; font-weight: 600; cursor: pointer; }

.learn-card {
  display: block; width: 100%; text-align: left;
  background: var(--teal-soft); border: 1px solid #CFE6E6;
  border-radius: 16px; padding: 14px 16px; margin-top: 18px; cursor: pointer;
}
.learn-card.coral { background: var(--coral-soft); border-color: #FFD9D2; }
.learn-card .lc-overline { font: 600 11px var(--font); letter-spacing: 0.7px; text-transform: uppercase; }
.learn-card .lc-title { font: 600 16px var(--font); color: var(--ink); margin: 5px 0 3px; }
.learn-card .lc-sub { font: 400 13px var(--font); color: var(--sub); }

.mini-action { font: 600 13px var(--font); color: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; background: none; cursor: pointer; display: inline-block; }
.rel-chip { font: 500 12.5px var(--font); color: var(--teal-dark); background: var(--teal-soft); padding: 6px 11px; border-radius: 20px; display: inline-block; }

/* ── Briefing Cards ── */
.briefing-card {
  display: block; width: calc(100% - 32px); margin: 12px 16px 0;
  text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px 16px 15px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20,40,45,0.04); transition: border-color 0.2s;
}
.briefing-card:hover { border-color: var(--teal); }
.briefing-card .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.briefing-card .card-tag { font: 600 10.5px var(--font); letter-spacing: 0.7px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.briefing-card .india-dot { font: 600 10px var(--font); color: var(--coral); letter-spacing: 0.5px; }
.briefing-card .card-time { margin-left: auto; font: 400 12px var(--font); color: var(--sub); }
.briefing-card .card-title { font: 600 16.5px var(--font); color: var(--ink); line-height: 1.32; letter-spacing: -0.2px; }
.briefing-card .card-dek { font: 400 13.5px var(--font); color: var(--sub); margin-top: 6px; line-height: 1.4; }
.briefing-card .read-more { font: 600 12.5px var(--font); color: var(--teal); margin-top: 11px; }
.briefing-card .card-source { font: 400 11px var(--font); color: var(--sub); margin-top: 8px; opacity: 0.7; }

/* ── Tag Filter Strip ── */
.tag-strip { display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tag-strip::-webkit-scrollbar { height: 0; }
.tag-pill {
  font: 600 11px var(--font); padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--card);
  cursor: pointer; white-space: nowrap; color: var(--sub); transition: all 0.2s;
}
.tag-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }

/* ── Loading ── */
.loading { text-align: center; padding: 40px 20px; color: var(--sub); font: 400 14px var(--font); }
.loading .spinner {
  width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--teal);
  border-radius: 50%; margin: 0 auto 12px; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Live dot ── */
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--coral);
  display: inline-block; margin-right: 5px; animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Track Card ── */
.track-card {
  display: flex; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 15px 16px; margin-bottom: 10px; cursor: default;
}
.track-card.clickable { cursor: pointer; }
.track-bar { width: 6px; height: 34px; border-radius: 4px; margin-right: 14px; flex-shrink: 0; }
.track-card .track-name { font: 600 16px var(--font); color: var(--ink); }
.track-card .track-count { font: 400 12.5px var(--font); color: var(--sub); margin-top: 2px; }
.track-card .track-open { font: 600 12px var(--font); color: var(--teal); margin-left: auto; }

/* ── Callout ── */
.callout { background: var(--teal-soft); border-radius: 14px; padding: 14px 16px; margin: 4px 0 18px; }
.callout .callout-title { font: 600 12px var(--font); color: var(--teal-dark); margin-bottom: 4px; }
.callout .callout-body { font: 400 13.5px var(--font); color: var(--ink); line-height: 1.5; }

/* ── Bottom Sheet ── */
.sheet-overlay {
  position: absolute; inset: 0; background: rgba(20,35,42,0.4);
  opacity: 0; transition: opacity 0.22s ease; z-index: 50; display: none;
}
.sheet-overlay.visible { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: #fff; border-radius: 22px 22px 0 0; padding: 16px 20px 26px;
  transform: translateY(100%); transition: transform 0.24s cubic-bezier(0.3,0.8,0.3,1);
  box-shadow: 0 -10px 40px rgba(20,35,42,0.2); z-index: 51; display: none;
}
.sheet.open { transform: translateY(0); }
.sheet-header { display: flex; align-items: flex-start; justify-content: space-between; }
.sheet .sheet-label { font: 600 10px var(--font); letter-spacing: 0.8px; color: var(--coral); text-transform: uppercase; }
.sheet .sheet-term { font: 600 19px var(--display); color: var(--ink); margin-top: 3px; }
.sheet .close-btn {
  width: 32px; height: 32px; border-radius: 16px; border: none;
  background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer;
  line-height: 32px; text-align: center; flex-shrink: 0;
}
.sheet .sheet-body { font: 400 14.5px var(--font); color: var(--ink); line-height: 1.58; margin: 12px 0 16px; }
.sheet .sheet-cta {
  width: 100%; background: var(--teal); color: #fff; border: none;
  border-radius: 13px; padding: 13px; font: 600 14.5px var(--font); cursor: pointer;
}
.sheet .sheet-hint { font: 500 11.5px var(--font); color: var(--sub); text-align: center; margin-top: 10px; }

.placeholder { padding: 40px; text-align: center; color: var(--sub); font: 400 15px var(--font); }
.placeholder .placeholder-icon { font-size: 34px; margin-bottom: 10px; }

.footer-hint { font: 500 12px var(--font); color: #8a857a; margin-top: 14px; text-align: center; max-width: 390px; }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span id="statusTime">9:41</span>
    <span class="brand">InsuralIQ</span>
    <span>▲ ⚡ ▮</span>
  </div>
  <div class="search-bar">
    <div class="search-bar-inner">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search news, concepts, companies…" oninput="handleSearch()">
    </div>
  </div>
  <div class="scroll-area" id="scrollArea"></div>
  <button class="fab-ai" onclick="alert('AI Assistant — pre-loaded with the context of whatever screen you\'re on. (Prototype stub.)')">Ask AI</button>
  <div class="bottom-nav" id="bottomNav">
    <button class="tab-btn active" data-tab="briefing" onclick="switchTab('briefing')"><span class="tab-icon">📰</span><span class="tab-label">Briefing</span></button>
    <button class="tab-btn" data-tab="pathshala" onclick="switchTab('pathshala')"><span class="tab-icon">📚</span><span class="tab-label">Pathshala</span></button>
    <button class="tab-btn" data-tab="companies" onclick="switchTab('companies')"><span class="tab-icon">🏢</span><span class="tab-label">Companies</span></button>
    <button class="tab-btn" data-tab="regs" onclick="switchTab('regs')"><span class="tab-icon">📋</span><span class="tab-label">Regs</span></button>
    <button class="tab-btn" data-tab="more" onclick="switchTab('more')"><span class="tab-icon">⋯</span><span class="tab-label">More</span></button>
  </div>
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-header">
      <div>
        <div class="sheet-label">Quick explainer</div>
        <div class="sheet-term" id="sheetTerm"></div>
      </div>
      <button class="close-btn" onclick="closeSheet()">×</button>
    </div>
    <p class="sheet-body" id="sheetBody"></p>
    <button class="sheet-cta" onclick="closeSheet(); setTimeout(()=>navigate('lesson'),240)">Read full lesson →</button>
    <div class="sheet-hint">Tap × to return exactly where you were reading</div>
  </div>
</div>
<div class="footer-hint">
  <span class="live-dot"></span> Live news from Indian insurance feeds · Refreshes every 15 min
</div>

<script>
// ── Config ──
const API_BASE = window.location.origin;

// ── Concept Data (same as prototype) ──
const CONCEPTS = {
  "surrender value": { term: "Surrender value", micro: "The amount a life insurer pays you if you end your policy before it matures. It's usually less than the premiums you've paid, since early premiums cover costs and your life cover. You receive the higher of two calculations — the Guaranteed Surrender Value or the Special Surrender Value. Since 1 October 2024, IRDAI requires insurers to pay a surrender value even after just one year of premiums, reversing the old rule where first-year exits got nothing." },
  "endowment plans": { term: "Endowment plans", micro: "A life insurance policy that combines protection with savings. You get a life cover, and if you survive the term, you receive a maturity payout. Premiums are higher than pure term insurance because part of your money is being saved and invested on your behalf." },
  "paid-up value": { term: "Paid-up value", micro: "If you stop paying premiums but don't surrender, your policy may continue with a reduced sum assured — this lower amount is the paid-up value. The cover doesn't vanish; it shrinks in proportion to the premiums you actually paid." },
  "premium": { term: "Premium", micro: "The amount you pay to the insurer — periodically or as a lump sum — to keep your policy active. Premiums are calculated based on the risk the insurer covers, your age, health, and the type and tenure of the policy." },
  "underwriting": { term: "Underwriting", micro: "The insurer's process of evaluating your risk profile before accepting you for coverage. They assess factors like your age, medical history, occupation, and lifestyle to decide the terms and premium." },
  "claim ratio": { term: "Claim ratio", micro: "The percentage of claims an insurer pays out versus the total claims received. A higher claim settlement ratio generally indicates that the insurer is more likely to honour legitimate claims." },
  "solvency ratio": { term: "Solvency ratio", micro: "A measure of an insurer's financial strength — the ratio of available assets to required solvency margin. IRDAI mandates a minimum of 150%, meaning the insurer must hold 1.5× the capital needed to cover obligations." },
  "term insurance": { term: "Term insurance", micro: "The simplest form of life insurance — pure risk cover with no savings or investment component. If the policyholder dies during the term, the nominee receives the sum assured. If the term expires, nothing is paid out (unless it's a return-of-premium variant)." },
};

// ── State ──
let currentScreen = 'briefing';
let liveArticles = [];
let availableTags = [];
let activeTag = 'All';
let searchQuery = '';
let scrollPositions = {};
let selectedArticle = null;

// ── API ──
async function fetchNews(tag, search) {
  let url = `${API_BASE}/api/news?limit=30`;
  if (tag && tag !== 'All') url += `&tag=${encodeURIComponent(tag)}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.articles || [];
  } catch (e) {
    console.error('Failed to fetch news:', e);
    return [];
  }
}

async function fetchTags() {
  try {
    const res = await fetch(`${API_BASE}/api/tags`);
    const data = await res.json();
    return data.tags || [];
  } catch (e) { return []; }
}

// ── Concept text rendering ──
function renderConceptText(text) {
  const keys = Object.keys(CONCEPTS).sort((a, b) => b.length - a.length);
  let html = '', remaining = text, guard = 0;
  while (remaining.length && guard < 400) {
    guard++;
    let hitIdx = -1, hitKey = null;
    for (const k of keys) {
      const i = remaining.toLowerCase().indexOf(k);
      if (i !== -1 && (hitIdx === -1 || i < hitIdx)) { hitIdx = i; hitKey = k; }
    }
    if (hitIdx === -1) { html += esc(remaining); break; }
    if (hitIdx > 0) html += esc(remaining.slice(0, hitIdx));
    html += `<button class="concept-chip" onclick="openConcept('${hitKey}')">${esc(remaining.slice(hitIdx, hitIdx + hitKey.length))}</button>`;
    remaining = remaining.slice(hitIdx + hitKey.length);
  }
  return html;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Render: Briefing (Live) ──
async function renderBriefing() {
  const area = document.getElementById('scrollArea');
  const today = new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

  // Show loading
  area.innerHTML = `
    <div style="padding:22px 20px 10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h1 style="font:600 27px var(--display);color:var(--ink);margin:0;letter-spacing:-0.5px">Daily Briefing</h1>
        <span style="font:500 13px var(--font);color:var(--sub)">${today}</span>
      </div>
      <p style="font:400 14px var(--font);color:var(--sub);margin:6px 0 0">
        <span class="live-dot"></span> India first. The news, and the ideas behind it.
      </p>
    </div>
    <div class="loading"><div class="spinner"></div>Fetching live insurance news…</div>`;

  // Fetch
  const [articles, tags] = await Promise.all([
    fetchNews(activeTag, searchQuery),
    fetchTags()
  ]);
  liveArticles = articles;
  availableTags = tags;

  // Tag strip
  let tagHtml = `<div class="tag-strip">
    <button class="tag-pill ${activeTag === 'All' ? 'active' : ''}" onclick="filterByTag('All')">All</button>`;
  tags.slice(0, 8).forEach(t => {
    tagHtml += `<button class="tag-pill ${activeTag === t.tag ? 'active' : ''}" onclick="filterByTag('${esc(t.tag)}')">${t.tag} (${t.count})</button>`;
  });
  tagHtml += '</div>';

  // Cards
  let cardsHtml = '';
  if (articles.length === 0) {
    cardsHtml = `<div style="text-align:center;padding:40px 20px;color:var(--sub);font:400 14px var(--font)">
      ${searchQuery ? 'No articles match your search.' : 'No articles available. The feeds may be loading.'}
    </div>`;
  } else {
    articles.forEach((a, i) => {
      const tagBg = a.india ? a.tagColor + '14' : '#EEEDE8';
      const conceptBadge = a.concepts && a.concepts.length > 0
        ? `<span style="font:500 10px var(--font);color:var(--teal);background:var(--teal-soft);padding:2px 6px;border-radius:4px;margin-left:4px">💡 ${a.concepts.length} concept${a.concepts.length > 1 ? 's' : ''}</span>`
        : '';
      cardsHtml += `
      <button class="briefing-card" onclick="openArticle(${i})">
        <div class="card-top">
          <span class="card-tag" style="color:${a.tagColor};background:${tagBg}">${esc(a.tag)}</span>
          ${a.india ? '<span class="india-dot">● INDIA</span>' : ''}
          ${conceptBadge}
          <span class="card-time">${esc(a.time)}</span>
        </div>
        <div class="card-title">${esc(a.title)}</div>
        <div class="card-dek">${esc(a.dek)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="card-source">via ${esc(a.source)}</span>
          <span style="font:600 12.5px var(--font);color:var(--teal)">Read →</span>
        </div>
      </button>`;
    });
  }

  area.innerHTML = `
    <div style="padding:22px 20px 10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <h1 style="font:600 27px var(--display);color:var(--ink);margin:0;letter-spacing:-0.5px">Daily Briefing</h1>
        <span style="font:500 13px var(--font);color:var(--sub)">${today}</span>
      </div>
      <p style="font:400 14px var(--font);color:var(--sub);margin:6px 0 0">
        <span class="live-dot"></span> India first. The news, and the ideas behind it.
      </p>
    </div>
    ${tagHtml}
    ${cardsHtml}
    <div style="padding:12px 16px 90px">
      <div style="text-align:center;font:400 11px var(--font);color:var(--sub);opacity:0.6">
        ${articles.length} articles · Auto-refreshes every 15 min
      </div>
    </div>`;
}

// ── Render: Article Detail ──
function renderArticle(article) {
  if (!article) return;
  const area = document.getElementById('scrollArea');
  const tagBg = article.tagColor + '14';

  area.innerHTML = `
    <div style="padding:0 0 90px">
      <div style="padding:16px 20px 0">
        <button class="back-btn" onclick="navigate('briefing')">← Briefing</button>
      </div>
      <div style="padding:8px 22px 0">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
          <span class="pill" style="color:${article.tagColor};background:${tagBg}">${esc(article.tag)}</span>
          ${article.india ? '<span style="font:600 10px var(--font);color:var(--coral);letter-spacing:0.5px">● INDIA</span>' : ''}
        </div>
        <h1 style="font:600 24px var(--display);color:var(--ink);line-height:1.24;margin:0;letter-spacing:-0.4px">
          ${esc(article.title)}
        </h1>
        <div style="font:400 12.5px var(--font);color:var(--sub);margin:12px 0 18px">
          via ${esc(article.source)} · ${esc(article.time)}
        </div>

        <div class="section-label">Summary</div>
        <p class="body-text">${renderConceptText(article.dek)}</p>

        ${article.concepts && article.concepts.length > 0 ? `
        <div class="section-label accent">Concepts in this story</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
          ${article.concepts.map(c => {
            const known = CONCEPTS[c];
            if (known) return `<button class="concept-chip" style="border-bottom:none;background:var(--coral-soft);padding:5px 10px;border-radius:8px;font-size:13px" onclick="openConcept('${c}')">${known.term} →</button>`;
            return `<span class="rel-chip">${c}</span>`;
          }).join('')}
        </div>` : ''}

        <a href="${esc(article.link)}" target="_blank" rel="noopener" class="learn-card" style="text-decoration:none">
          <div class="lc-overline" style="color:var(--teal)">Full article</div>
          <div class="lc-title">Read on ${esc(article.source)} ↗</div>
          <div class="lc-sub">Opens in a new tab</div>
        </a>

        <div style="display:flex;gap:10px;margin-top:16px">
          <span class="mini-action">♡ Save</span>
          <span class="mini-action">↗ Share</span>
        </div>
        <div style="font:500 11px var(--font);color:var(--sub);margin-top:8px">
          Tip: tap any coral underlined term to see a quick explainer.
        </div>
      </div>
    </div>`;
}

// ── Render: Lesson (same as prototype) ──
function renderLesson() {
  const area = document.getElementById('scrollArea');
  area.innerHTML = `
    <div style="padding:0 0 90px">
      <div style="padding:16px 20px 0">
        <button class="back-btn" onclick="navigate(selectedArticle !== null ? 'article-detail' : 'briefing')">← Back</button>
      </div>
      <div style="padding:8px 22px 0">
        <span class="pill" style="color:var(--coral);background:#FF6B5B14">Life Insurance</span>
        <h1 style="font:600 25px var(--display);color:var(--ink);margin:12px 0 4px;letter-spacing:-0.4px">Surrender Value</h1>
        <div style="font:400 12.5px var(--font);color:var(--sub);margin-bottom:18px">4-min read · Reviewed Aug 2026</div>

        <div class="section-label">What it is</div>
        <p class="body-text">${renderConceptText("Surrender value is the money a life insurance company pays you if you end your policy before it matures. Think of it as the \"exit amount.\" You stop paying premiums, walk away, and the insurer returns a portion of what the policy is worth. It's usually less than the premiums you've paid — and the reason why is what most people miss.")}</p>

        <div class="section-label accent">Why it matters</div>
        <p class="body-text">${renderConceptText("Endowment plans can run 15, 20, even 30 years. Life changes. For years the rules were harsh: surrender in the first year and you got nothing back. That's exactly what the 2024 reform set out to fix.")}</p>

        <div class="section-label">How it works</div>
        <p class="body-text">${renderConceptText("You receive whichever is higher of two figures. The Guaranteed Surrender Value is a fixed percentage of premiums — roughly 30% in year two, rising to 90% in the final years. The Special Surrender Value is based on your paid-up value and can be higher for longer-held policies.")}</p>

        <div class="callout">
          <div class="callout-title">The 2024 shift</div>
          <div class="callout-body">From 1 October 2024, insurers must pay a surrender value even after just one full year of premiums — where before, first-year exits received zero.</div>
        </div>

        <div class="section-label">Common misunderstanding</div>
        <p class="body-text">${renderConceptText("\"I'll get back everything I paid.\" No — surrender value is almost always less than total premiums, because early premiums covered the insurer's costs and your life cover during those years.")}</p>

        <div class="section-label">Related lessons</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <span class="rel-chip">Paid-up value</span>
          <span class="rel-chip">Endowment plans</span>
          <span class="rel-chip">Lapsation</span>
          <span class="rel-chip">Maturity value</span>
        </div>

        <button class="learn-card coral" onclick="navigate('pathshala')">
          <div class="lc-overline" style="color:var(--coral)">Keep learning</div>
          <div class="lc-title" style="font-size:15.5px">Explore the Life Insurance track →</div>
        </button>
      </div>
    </div>`;
}

// ── Render: Pathshala ──
function renderPathshala() {
  const tracks = [
    { name: "Insurance Basics", count: "10 lessons", color: "#0E7C86" },
    { name: "Life Insurance", count: "10 lessons", color: "#FF6B5B", live: true },
    { name: "Health Insurance", count: "9 lessons", color: "#7A5CC4" },
    { name: "General Insurance", count: "8 lessons", color: "#E0A100" },
    { name: "Glossary", count: "120+ terms", color: "#0A5A62" },
  ];
  const area = document.getElementById('scrollArea');
  area.innerHTML = `
    <div style="padding:22px 16px 90px">
      <h1 style="font:600 27px var(--display);color:var(--ink);margin:0 4px;letter-spacing:-0.5px">Insurance Pathshala</h1>
      <p style="font:400 14px var(--font);color:var(--sub);margin:6px 4px 18px">Learn the concepts behind the headlines. Bite-sized, beginner-first.</p>
      ${tracks.map(t => `
        <button class="track-card${t.live ? ' clickable' : ''}" ${t.live ? `onclick="navigate('lesson')"` : ''}>
          <div class="track-bar" style="background:${t.color}"></div>
          <div style="flex:1">
            <div class="track-name">${t.name}</div>
            <div class="track-count">${t.count}</div>
          </div>
          ${t.live ? '<span class="track-open">Open →</span>' : ''}
        </button>`).join('')}
    </div>`;
}

function renderPlaceholder(id) {
  const icons = { companies: '🏢', regs: '📋', more: '⋯' };
  document.getElementById('scrollArea').innerHTML = `
    <div class="placeholder">
      <div class="placeholder-icon">${icons[id] || '⋯'}</div>
      This tab is part of the full build.<br>The prototype focuses on the core Briefing → Pathshala flow.
    </div>`;
}

// ── Navigation ──
function navigate(screen) {
  const scrollArea = document.getElementById('scrollArea');
  scrollPositions[currentScreen] = scrollArea.scrollTop;
  currentScreen = screen;
  render();
  scrollArea.scrollTop = scrollPositions[screen] || 0;
  updateTabs();
}

function switchTab(tab) {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  if (tab === 'briefing') { activeTag = 'All'; navigate('briefing'); }
  else if (tab === 'pathshala') navigate('pathshala');
  else navigate(tab);
}

function filterByTag(tag) {
  activeTag = tag;
  navigate('briefing');
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim();
  // Debounce
  clearTimeout(handleSearch._t);
  handleSearch._t = setTimeout(() => {
    if (currentScreen === 'briefing') renderBriefing();
  }, 350);
}

function openArticle(idx) {
  selectedArticle = idx;
  navigate('article-detail');
}

function render() {
  switch (currentScreen) {
    case 'briefing': renderBriefing(); break;
    case 'article-detail': renderArticle(liveArticles[selectedArticle]); break;
    case 'lesson': renderLesson(); break;
    case 'pathshala': renderPathshala(); break;
    default: renderPlaceholder(currentScreen);
  }
}

function updateTabs() {
  const activeTabId =
    ['article-detail', 'briefing'].includes(currentScreen) ? 'briefing' :
    ['lesson', 'pathshala'].includes(currentScreen) ? 'pathshala' :
    currentScreen;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === activeTabId);
  });
}

// ── Sheet ──
function openConcept(key) {
  const c = CONCEPTS[key];
  if (!c) return;
  document.getElementById('sheetTerm').textContent = c.term;
  document.getElementById('sheetBody').textContent = c.micro;
  document.getElementById('sheetOverlay').style.display = 'block';
  document.getElementById('sheet').style.display = 'block';
  requestAnimationFrame(() => {
    document.getElementById('sheetOverlay').classList.add('visible');
    document.getElementById('sheet').classList.add('open');
  });
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('visible');
  document.getElementById('sheet').classList.remove('open');
  setTimeout(() => {
    document.getElementById('sheetOverlay').style.display = 'none';
    document.getElementById('sheet').style.display = 'none';
  }, 240);
}

// ── Clock ──
function updateClock() {
  const now = new Date();
  document.getElementById('statusTime').textContent =
    now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: false });
}

// ── Init ──
updateClock();
setInterval(updateClock, 60000);
renderBriefing();
</script>
</body>
</html>
