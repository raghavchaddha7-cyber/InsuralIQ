        { label: "What it is", text: "Pradhan Mantri Jan Arogya Yojana (PMJAY), the flagship scheme under Ayushman Bharat, is the world's largest government-funded health insurance program. It provides ₹5 lakh per family per year for secondary and tertiary hospitalization to over 55 crore beneficiaries from economically weaker sections — roughly 40% of India's population." },
        { label: "How it works", text: "Eligible families are identified from the SECC (Socio-Economic Caste Census) database. No premium is paid by beneficiaries — the government funds it entirely. Coverage includes 3 days of pre-hospitalization and 15 days of post-hospitalization expenses. Over 1,950 treatment packages are covered across 27 specialties." },
        { label: "Impact and scale", text: "Since its 2018 launch, PMJAY has issued over 30 crore Ayushman cards and authorized over 7 crore hospital treatments. It has empaneled 30,000+ hospitals (both public and private). The scheme has been a game-changer in tier-2 and tier-3 cities where private hospital utilization by low-income families has surged." },
        { label: "Industry implications", text: "For the insurance industry, PMJAY has expanded the awareness of health insurance among populations that had never interacted with formal insurance. It has created infrastructure (hospital empanelment, digital claims) that private insurers can leverage. However, low reimbursement rates under PMJAY remain a challenge — many private hospitals find the package rates commercially unviable." },
      ]},
    { title: "Group Health Insurance", subtitle: "How employer-sponsored health cover works", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Group health insurance (GMC — Group Mediclaim) is a health policy purchased by an employer for its employees and often their dependents. It's the most common employee benefit in India's formal sector. The employer pays the premium, and all employees get covered under a single master policy from day one of joining." },
        { label: "Key features", text: "No waiting periods for pre-existing diseases (unlike individual policies that impose 2-4 year waits). No medical tests required for enrollment. Coverage typically includes hospitalization, daycare procedures, maternity benefits, and sometimes OPD. Sum insured usually ranges from ₹3-10 lakh per employee, with some top companies offering ₹25 lakh+." },
        { label: "Group vs individual plans", text: "Group plans are cheaper per person, have no waiting periods, and cover pre-existing conditions from day one. However, coverage ends when you leave the job, sum insured may be insufficient, and you have no say in the insurer or policy terms. Individual plans are portable, lifelong renewable, and customizable." },
        { label: "Best practice", text: "Treat your employer's group health cover as a bonus, not your primary health protection. Buy your own individual health policy early (when you're young and healthy, premiums are low) and maintain it throughout your career. This way, job changes don't leave you uninsured, and you build continuous coverage that reduces waiting periods over time." },
      ]},
    { title: "Health Insurance Portability", subtitle: "Switch insurers without losing your benefits", duration: "3-min read",
      sections: [
        { label: "What is portability", text: "Health insurance portability allows you to switch from one insurer to another without losing the credit for the waiting periods you've already served. Introduced by IRDAI in 2011, it means that if you've completed 2 years of waiting for a pre-existing condition with Insurer A, Insurer B must give you credit for those 2 years." },
        { label: "How to port", text: "Apply to the new insurer at least 45 days before your existing policy's renewal date. The new insurer will request your claims history from the old insurer. They may accept, reject, or modify terms (like loading a higher premium). Portability is your right, but the new insurer is not obligated to accept you at standard rates." },
        { label: "What transfers", text: "Waiting period credits transfer — this is the core benefit. No-claim bonus may or may not transfer depending on the new insurer's policy. Coverage amount can be increased or maintained. You can also port between different product types (e.g., from a basic plan to a comprehensive one)." },
        { label: "Common mistakes", text: "Don't let your current policy lapse before porting — that breaks continuity and resets all waiting periods. Don't apply too late — the 45-day advance requirement is strict. Don't assume the new insurer will match your current terms — they can underwrite you afresh. Always compare the new policy's features, network hospitals, and claim settlement experience before porting." },
      ]},
    { title: "Senior Citizen Health Insurance", subtitle: "Covering the most vulnerable when they need it most", duration: "4-min read",
      sections: [
        { label: "The challenge", text: "Health insurance for senior citizens (60+) is one of the toughest segments in insurance. Medical costs spike dramatically after 60 — hospitalization rates are 3-4× higher than younger populations, chronic conditions like diabetes, hypertension, and arthritis are near-universal, and treatment costs escalate. As a result, premiums are high (₹25,000-80,000/year for ₹5-10 lakh cover) and many insurers impose strict entry-age limits." },
        { label: "Key features to look for", text: "No medical test entry (some policies for 60-65 accept based on declaration). Pre-existing disease cover after reduced waiting (1-2 years instead of 4). High sub-limits for room rent, ICU, and surgery. AYUSH treatment cover (Ayurveda, Yoga, Naturopathy, Unani, Siddha, Homeopathy). Domiciliary hospitalization (treatment at home if hospital beds are unavailable). Home healthcare and physiotherapy cover." },
        { label: "Products to know", text: "Star Health's Senior Citizens Red Carpet: entry up to age 75, cover up to ₹25 lakh. Niva Bupa's Senior First: lifelong renewability, pre-existing cover from day 1 (with higher premium). National Insurance's Varistha Mediclaim: government insurer, affordable but basic. New India Assurance's Senior Citizen Mediclaim: covers up to age 80. IRDAI has mandated that no insurer can refuse renewal to a senior citizen — lifelong renewability is guaranteed." },
        { label: "Planning ahead", text: "The best strategy: buy your health policy in your 20s-30s and never let it lapse. By the time you're 60, you'll have served all waiting periods, built substantial no-claim bonuses (reducing premiums), and established continuous coverage. Buying fresh at 60 means high premiums, long waiting periods for pre-existing conditions, and limited options. If your parents are uninsured, help them buy a policy immediately — every year of delay makes it harder and more expensive." },
      ]},
    { title: "Mental Health & Insurance", subtitle: "How the Mental Healthcare Act changed insurance coverage", duration: "3-min read",
      sections: [
        { label: "The landmark change", text: "The Mental Healthcare Act, 2017 made history by mandating that insurers treat mental illness at par with physical illness. Section 21(4) states: 'Every insurer shall make provision for medical insurance for treatment of mental illness on the same basis as is available for treatment of physical illness.' This means health insurance policies cannot exclude psychiatric hospitalization, depression treatment, or therapy." },
        { label: "What's covered now", text: "In-patient psychiatric treatment (hospitalization for severe conditions). OPD consultations with psychiatrists (in policies that cover OPD). Medication for diagnosed mental health conditions. De-addiction treatment in recognized centers. However, coverage often requires a formal diagnosis from a qualified psychiatrist, and many policies still have sub-limits or waiting periods for mental health claims." },
        { label: "Practical challenges", text: "Despite the law, claiming for mental health remains difficult. Many policyholders don't know they're entitled. Some insurers still reject claims citing exclusion clauses from older policy wordings. Stigma prevents people from filing claims — they don't want a mental health diagnosis on their insurance record. And most mental health treatment is outpatient (therapy sessions), which basic health policies don't cover at all." },
      ]},
    { title: "OPD & Day-Care Coverage", subtitle: "Insurance beyond hospitalization", duration: "3-min read",
      sections: [
        { label: "Why OPD matters", text: "Traditional health insurance only covers in-patient hospitalization (24+ hours admission). But most healthcare spending is outpatient — doctor consultations, diagnostic tests, medicines, physiotherapy, dental care, and eye checkups. Indians spend approximately ₹4,000-8,000 per year on OPD expenses. Until recently, none of this was insurable. That's changing." },
        { label: "OPD insurance", text: "Several insurers now offer OPD coverage either as standalone products or add-ons. These cover doctor consultations (in-person and teleconsultation), prescribed medicines and diagnostics, dental treatments, vision care (spectacles, eye checkups), and preventive health checkups. Premiums range from ₹3,000-8,000/year for ₹10,000-50,000 of OPD cover. Products like ManipalCigna's ProHealth Prime and Niva Bupa's ReAssure 2.0 include OPD." },
        { label: "Day-care procedures", text: "Day-care procedures are treatments that used to require 24+ hours in hospital but can now be done in under 24 hours thanks to medical advances — cataract surgery, chemotherapy, dialysis, lithotripsy, angioplasty. IRDAI mandates that all health policies cover day-care procedures. Most policies cover 500+ named day-care procedures. Always check your policy's day-care list — exclusions here are a common complaint." },
      ]},
    { title: "Arogya Sanjeevani — The Standard Health Policy", subtitle: "IRDAI's standardized product every insurer must offer", duration: "3-min read",
      sections: [
        { label: "What it is", text: "Arogya Sanjeevani is a standardized health insurance product that IRDAI mandated every general and health insurer to offer from April 2020. The idea: with dozens of insurers offering hundreds of health products with different terms, exclusions, and fine print, comparing policies was nearly impossible. Arogya Sanjeevani has identical features, terms, and conditions across ALL insurers — the only variable is the premium." },
        { label: "Key features", text: "Sum insured: ₹1 lakh to ₹10 lakh. Coverage: hospitalization, pre and post-hospitalization (30/60 days), day-care procedures, AYUSH treatments, ambulance (up to ₹2,000), and cataract treatment (up to ₹40,000). Room rent: no sub-limit (you can choose any room). Co-payment: mandatory 5% co-pay on every claim. Waiting periods: 30 days initial, 48 months for pre-existing, 24 months for specific diseases." },
        { label: "Limitations", text: "The 5% mandatory co-payment is the biggest drawback — on a ₹10 lakh claim, you pay ₹50,000 from your pocket. No maternity cover. No restoration benefit (once the sum insured is exhausted, no additional cover). No OPD cover. Sum insured capped at ₹10 lakh — insufficient for major treatments in metro cities. These limitations make it a good base policy, but you'll likely need a super top-up or comprehensive plan alongside it." },
        { label: "When to choose it", text: "Arogya Sanjeevani is perfect for: first-time buyers who want simplicity, people who find comparing policies overwhelming, supplementary cover for family members, and as a base policy with a super top-up on top. Since features are identical, simply buy from the insurer offering the lowest premium in your age bracket — use Policybazaar or InsuranceDekho to compare." },
      ]},
    { title: "Climate Change & Health Insurance", subtitle: "How environmental shifts are creating new health risks", duration: "4-min read",
      sections: [
        { label: "Climate-driven health risks", text: "Climate change is expanding the burden of disease in India. Heat-related illnesses (heat stroke, dehydration, kidney disease) are surging — India recorded its hottest-ever temperatures in 2024. Air pollution (AQI 400+ days in Delhi NCR) drives respiratory diseases, cardiovascular events, and cancer. Vector-borne diseases like dengue, chikungunya, and malaria are spreading to new altitudes and latitudes as temperatures rise. Waterborne diseases spike after increasingly frequent urban floods." },
        { label: "Impact on health insurance claims", text: "Insurers are seeing climate-correlated claims patterns. Respiratory illness claims rise 30-40% during peak pollution months (October-January in north India). Dengue hospitalization claims have expanded beyond traditional hotspots. Heat stroke claims are a new category that barely existed a decade ago. These trends are pushing up claim ratios, which eventually translates to higher premiums — especially in climate-vulnerable cities." },
        { label: "Emerging coverage gaps", text: "Most health policies weren't designed for climate-era risks. Chronic conditions from long-term pollution exposure (COPD, asthma exacerbation) face pre-existing condition exclusions. Mental health impacts of climate anxiety and climate displacement are rarely covered adequately. Occupational heat illness for outdoor workers (construction, agriculture, delivery) falls through gaps between health insurance and workers' compensation." },
        { label: "What consumers should do", text: "Choose policies with robust respiratory and cardiac disease coverage. Ensure your policy covers day-care procedures (nebulization, dialysis) that are increasingly climate-linked. Consider critical illness riders covering cancers linked to environmental exposure. If you live in a pollution-heavy city, prioritize comprehensive cover over cost savings. Watch for new 'climate health' products — some global insurers are launching policies specifically covering climate-related health conditions." },
      ]},
    { title: "Pandemic Insurance", subtitle: "Lessons from COVID-19 and the future of epidemic cover", duration: "4-min read",
      sections: [
        { label: "COVID-19's impact on health insurance", text: "The COVID-19 pandemic was a watershed moment for Indian health insurance. Health insurance claims jumped from ₹35,000 crore in FY20 to over ₹60,000 crore in FY22. Many policies initially excluded pandemic-related hospitalization until IRDAI mandated coverage. The industry launched India's first-ever pandemic-specific product — Corona Kavach and Corona Rakshak — within months. Post-COVID, health insurance penetration in India jumped significantly as millions realized the importance of cover." },
        { label: "What changed permanently", text: "Telemedicine coverage became standard in many health policies after COVID proved remote consultations work. Home hospitalization (domiciliary treatment) coverage expanded dramatically — during peak COVID waves, hospitals were full and patients recovered at home under medical supervision. IRDAI mandated that standard health policies must cover pandemic-related claims without exclusion. Waiting periods for COVID-related claims were waived by most insurers." },
        { label: "Pandemic risk pools", text: "COVID exposed that individual insurers cannot absorb pandemic-scale losses alone. Globally, there are proposals for pandemic risk pools — government-backed funds where insurers, governments, and capital markets share pandemic risk (similar to terrorism insurance pools post-9/11). India's GIC Re (General Insurance Corporation) absorbed massive reinsurance losses during COVID. IRDAI is studying pooled mechanisms to ensure the industry can handle future pandemics without insolvency risk." },
        { label: "Preparing for the next pandemic", text: "Epidemiologists warn that pandemics will become more frequent due to deforestation, wildlife trade, and climate change pushing animal-human disease transmission. For consumers: maintain continuous health coverage (don't drop policies during 'healthy' years), ensure your policy explicitly doesn't exclude epidemics/pandemics, consider higher sum insured to account for ICU costs during surge pricing, and keep a super top-up as a second layer of defense." },
      ]},
    { title: "Global Health Insurance & Portability", subtitle: "Health cover that works across borders", duration: "3-min read",
      sections: [
        { label: "What is global health insurance", text: "Global health insurance provides medical coverage that works across multiple countries — unlike domestic health policies that only cover treatment in India, and travel insurance that only covers short trips abroad. It's designed for expats, frequent international travelers, students studying abroad, and globally mobile professionals. Premiums are significantly higher (₹2-10 lakh/year) but coverage is comprehensive: inpatient, outpatient, dental, maternity, mental health, and evacuation — worldwide." },
        { label: "Health insurance portability in India", text: "IRDAI's portability regulations allow you to switch your health insurance from one insurer to another without losing accrued benefits — waiting periods already served, no-claim bonuses earned, and coverage for pre-existing conditions after the waiting period. You must apply for portability at least 45 days before renewal. The new insurer cannot impose fresh waiting periods for conditions already past the waiting period. This gives consumers real power to switch to better products." },
        { label: "Cross-border treatment trends", text: "Medical value travel (Indians going abroad for treatment) and medical tourism (foreigners coming to India) are both growing. Some Indian health policies now offer optional international treatment coverage for specific conditions like cancer and organ transplants. Conversely, India is a top destination for affordable cardiac surgery, joint replacement, and dental work. Understanding how your health policy handles international treatment — cashless network, currency of reimbursement, excluded countries — is increasingly important." },
      ]},
  ],
  "General Insurance": [
    { title: "Motor Insurance Basics", subtitle: "Third party vs own damage — and why you need both", duration: "4-min read",
      sections: [
        { label: "Third Party (TP)", text: "Mandatory by law. Covers your legal liability if your vehicle causes injury, death, or property damage to someone else. Does NOT cover damage to your own vehicle. Premiums are fixed by IRDAI." },
        { label: "Own Damage (OD)", text: "Covers damage to your own vehicle from accidents, theft, fire, floods, and vandalism. Premiums vary by insurer based on the vehicle's IDV (Insured Declared Value), make, model, location, and your claims history." },
        { label: "Comprehensive", text: "Combines TP and OD in a single policy. This is what most vehicle owners should choose. Add-ons like zero depreciation, engine protection, and roadside assistance provide even better coverage." },
      ]},
    { title: "Home Insurance", subtitle: "Protecting your biggest asset", duration: "3-min read",
      sections: [
        { label: "What it covers", text: "Home insurance protects the structure of your house and/or its contents against fire, natural disasters, theft, and other perils. Some policies also cover temporary accommodation costs if your home becomes uninhabitable." },
        { label: "Structure vs contents", text: "Structure cover protects walls, roof, foundation, and permanent fixtures. Contents cover protects furniture, electronics, appliances, and personal belongings. You can buy either or both." },
        { label: "Why it's underused", text: "India's home insurance penetration is extremely low — less than 1% of homes are insured. Yet natural disasters like floods, earthquakes, and cyclones affect millions of Indian homes annually." },
      ]},
    { title: "Third-Party vs Comprehensive Motor", subtitle: "Choosing the right vehicle insurance", duration: "4-min read",
      sections: [
        { label: "Third-Party only", text: "Third-party (TP) motor insurance is the bare legal minimum under the Motor Vehicles Act. It covers your liability if your vehicle injures someone, causes death, or damages someone else's property. It does NOT cover damage to your own vehicle. Premiums are fixed by IRDAI — you cannot negotiate them, and they're the same across all insurers." },
        { label: "Comprehensive cover", text: "Comprehensive insurance = TP liability + Own Damage (OD). The OD component covers your vehicle against accidents, theft, fire, floods, riots, and natural disasters. Unlike TP, OD premiums vary by insurer, allowing you to compare and negotiate. The OD premium is based on your vehicle's IDV (Insured Declared Value — basically the current market value)." },
        { label: "No Claim Bonus (NCB)", text: "NCB is your reward for not making claims. It's a discount on your OD premium that grows each claim-free year: 20% after year 1, 25% after year 2, up to 50% after 5 claim-free years. NCB belongs to the owner, not the vehicle — it transfers when you buy a new car. Making even one small claim resets it to zero, so weigh small repairs vs losing your NCB." },
        { label: "Add-ons worth considering", text: "Zero Depreciation: insurer pays full repair cost without deducting for depreciation of parts (critical for new cars). Engine Protection: covers engine damage from water logging (essential in flood-prone cities). Return to Invoice (RTI): in case of total loss, you get the invoice value rather than depreciated IDV. Roadside Assistance: towing, battery jump-start, flat tire help." },
      ]},
    { title: "Crop Insurance (PMFBY)", subtitle: "Protecting India's farmers from nature's uncertainty", duration: "4-min read",
      sections: [
        { label: "What is PMFBY", text: "Pradhan Mantri Fasal Bima Yojana (PMFBY), launched in 2016, is the Indian government's flagship crop insurance scheme. It protects farmers against crop loss or damage due to natural calamities, pests, and diseases. The scheme covers all food crops, oilseeds, commercial, and horticultural crops." },
        { label: "Premium structure", text: "Farmer premiums are kept extremely low: 2% for Kharif crops, 1.5% for Rabi crops, and 5% for commercial/horticultural crops. The actual actuarial premium can be 15-20% — the massive difference is subsidized equally by central and state governments. This makes it one of the most heavily subsidized insurance programs globally." },
        { label: "How claims work", text: "Claims are triggered by area-based yield estimation, not individual farm assessment. Government-mandated Crop Cutting Experiments (CCEs) determine the average yield for a defined area. If actual yield falls below the threshold yield (based on 7-year average), all insured farmers in that area receive compensation proportionally." },
        { label: "Challenges and reforms", text: "PMFBY was made voluntary for farmers in 2020 (earlier it was mandatory for crop loan borrowers). Claim settlement delays remain a concern — states often delay their premium subsidy share. Technology adoption (satellite imaging, drones, weather stations) is improving assessment accuracy. The scheme covers over 5.5 crore farmer applications annually, making it the world's largest crop insurance program by enrollment." },
      ]},
    { title: "Travel Insurance", subtitle: "Essential protection for domestic and international travel", duration: "4-min read",
      sections: [
        { label: "What it covers", text: "Travel insurance provides financial protection against unexpected events during trips: medical emergencies abroad, trip cancellation/interruption, lost or delayed baggage, passport loss, flight delays, and personal liability. For international travel, medical cover is the most critical component — healthcare costs in the US, Europe, or Southeast Asia can be devastating without insurance." },
        { label: "Domestic vs international", text: "Domestic travel insurance covers trip cancellation, baggage loss, personal accident, and hotel burglary — but medical expenses are usually handled by your regular health policy. International travel insurance is far more important: it covers overseas medical treatment (₹50 lakh to ₹1 crore), emergency evacuation, repatriation of remains, and is mandatory for Schengen visa applications (minimum €30,000 cover)." },
        { label: "Key features to compare", text: "Medical cover limit (go for at least $50,000 for Southeast Asia, $100,000 for US/Europe). Cashless hospitalization network abroad. Coverage for pre-existing conditions (most policies exclude them). Adventure sports cover (if you plan trekking, scuba, skiing). COVID-19 coverage. Deductible amounts. Emergency dental treatment cover." },
        { label: "Claims tips", text: "Carry your policy documents and insurer's 24/7 helpline number. Notify the insurer immediately in case of medical emergency. For baggage claims, get a Property Irregularity Report (PIR) from the airline within 21 days. Keep all receipts for emergency purchases made due to baggage delay. File claims within the policy-specified window (usually 30 days of return)." },
      ]},
    { title: "Fire & Marine Insurance", subtitle: "Commercial insurance pillars every BFSI professional should know", duration: "4-min read",
      sections: [
        { label: "Fire insurance", text: "Fire insurance covers property (buildings, machinery, stock, furniture) against fire and allied perils — lightning, explosion, implosion, aircraft damage, riot, storm, flood, earthquake, and more. The Standard Fire and Special Perils (SFSP) policy is the base product used across India. Sum insured should reflect the reinstatement value (cost to rebuild/replace) rather than market value." },
        { label: "Marine insurance", text: "Marine insurance is one of the oldest forms of insurance. Marine Cargo Insurance covers goods in transit — by sea, air, rail, or road. Marine Hull Insurance covers the vessel itself. In India, it's governed by the Marine Insurance Act, 1963 (based on the UK Marine Insurance Act, 1906). Key coverage types: Institute Cargo Clauses A (all risks), B (named perils), and C (basic perils)." },
        { label: "Business relevance", text: "Fire and marine insurance are the foundation of commercial insurance portfolios. Banks mandate fire insurance for property used as collateral. Import/export businesses require marine cargo policies for every shipment. Manufacturing units need fire policies covering building, machinery, stock, and business interruption (loss of profits during shutdown)." },
        { label: "Business Interruption cover", text: "Also called Loss of Profit (LOP) insurance, this add-on to fire policies covers the income loss when business operations halt due to an insured peril. It pays for continuing fixed expenses (rent, salaries) and lost net profit during the indemnity period (typically 12-24 months). For many businesses, the interruption loss far exceeds the physical damage loss." },
      ]},
    { title: "Cyber Insurance", subtitle: "Protection in the digital age", duration: "4-min read",
      sections: [
        { label: "Why it matters now", text: "India reported over 13.9 lakh cyber security incidents in 2022 (CERT-In data). As businesses digitize, cyber risks — data breaches, ransomware attacks, phishing, and system failures — have become as real as fire or theft. Cyber insurance is the fastest-growing segment in the Indian general insurance market." },
        { label: "What it covers", text: "First-party covers: costs of data restoration, business interruption from cyber attacks, cyber extortion/ransomware payments (where legally permissible), forensic investigation costs, and notification expenses (informing affected customers). Third-party covers: legal liability for data breaches, regulatory fines and penalties (where insurable), and defense costs in lawsuits." },
        { label: "For individuals", text: "Personal cyber insurance covers: financial losses from online banking/credit card fraud, identity theft expenses, cyber stalking/bullying (legal costs), social media hacking, phishing losses, and malware attacks on personal devices. Policies cost ₹1,000-5,000 per year for covers of ₹1-10 lakh — affordable given the rising frequency of online fraud." },
        { label: "Market landscape", text: "Major Indian insurers like ICICI Lombard, Bajaj Allianz, HDFC ERGO, and Tata AIG offer cyber insurance. The Indian cyber insurance market is expected to grow at 30-40% CAGR. Key challenge: underwriting cyber risk is difficult because attack patterns evolve rapidly, historical data is limited, and a single event (like a cloud provider outage) can trigger claims across thousands of policyholders simultaneously." },
      ]},
    { title: "Liability Insurance", subtitle: "Protecting against legal claims and lawsuits", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Liability insurance protects the insured against legal liability to pay compensation to third parties for bodily injury, property damage, or financial loss caused by the insured's actions, products, or operations. Unlike property insurance (which protects your own assets), liability insurance protects you from claims by others." },
        { label: "Types of liability cover", text: "Public Liability: covers claims from the general public injured by your business operations. Product Liability: covers claims arising from defective products you manufacture or sell (critical after the Consumer Protection Act, 2019 strengthened product liability). Professional Indemnity: covers professionals (doctors, CAs, lawyers, architects) against claims of negligence or errors. Directors & Officers (D&O): protects company directors from personal liability for management decisions." },
        { label: "India-specific context", text: "The Public Liability Insurance Act, 1991 mandates that industries handling hazardous substances must buy public liability cover. After the Bhopal Gas Tragedy, India strengthened its liability insurance framework significantly. Product liability under the Consumer Protection Act, 2019 has made product liability insurance essential for manufacturers and e-commerce platforms." },
        { label: "Why it's growing", text: "As India's legal environment matures, litigation culture is increasing. Consumer courts are becoming more active, class action suits are emerging, and regulatory penalties are rising. Liability insurance premiums in India have grown 20-25% annually. For any business interacting with customers, employees, or the public, liability insurance is becoming as essential as fire insurance." },
      ]},
    { title: "Engineering Insurance", subtitle: "Protecting construction projects and industrial machinery", duration: "4-min read",
      sections: [
        { label: "What it covers", text: "Engineering insurance is a specialized class of general insurance designed for construction projects and industrial plant. The two main products are: Contractors' All Risk (CAR) — covers civil construction projects (buildings, bridges, roads, dams) against physical loss or damage during construction; and Erection All Risk (EAR) — covers installation and erection of machinery, steel structures, and electrical/electronic equipment." },
        { label: "Key policy types", text: "Contractors' Plant & Machinery (CPM): covers construction equipment like cranes, excavators, and piling rigs. Boiler & Pressure Plant: covers explosion and breakdown of boilers and pressure vessels. Machinery Breakdown (MB): covers sudden and unforeseen physical damage to installed machinery from electrical short-circuit, mechanical breakdown, operator error, etc. Electronic Equipment Insurance (EEI): covers computers, servers, medical devices, broadcast equipment." },
        { label: "Why it matters for India", text: "India's massive infrastructure push — highways, metro systems, smart cities, industrial corridors — has made engineering insurance critical. Bank and project lenders mandate CAR/EAR policies for all financed construction projects. The National Infrastructure Pipeline (NIP) envisages ₹111 lakh crore in infrastructure investment, which means engineering insurance premiums will continue to grow rapidly." },
        { label: "Claims and challenges", text: "Engineering claims can be enormous — a single bridge collapse or turbine failure can run into hundreds of crores. Key challenges include accurate sum insured estimation (under-insurance is common), proper maintenance documentation (insurers can reject claims if maintenance was poor), and understanding defects exclusions. Most engineering policies use a 'sudden and unforeseen' damage trigger — gradual wear and tear is never covered." },
      ]},
    { title: "Parametric Insurance", subtitle: "When payouts are triggered by data, not damage assessment", duration: "4-min read",
      sections: [
        { label: "How it works", text: "Traditional insurance pays after loss assessment — you suffer damage, file a claim, an adjuster inspects, and eventually you get paid. Parametric insurance flips this: payouts are triggered automatically when a pre-defined parameter (rainfall, wind speed, earthquake magnitude, temperature) crosses a threshold. No claim filing, no assessment, no adjuster. If the trigger fires, money hits your account within days." },
        { label: "Examples in India", text: "PMFBY's weather-based crop insurance uses rainfall data to trigger payouts for farmers. The Agriculture Insurance Company of India offers Weather Based Crop Insurance Scheme (WBCIS) that pays if district rainfall falls below thresholds. Coral Cover (a global initiative) uses satellite sea-temperature data to trigger reef-protection payouts. Some Indian micro-insurance pilots trigger payouts when cyclone wind speeds exceed set limits in specific districts." },
        { label: "Advantages", text: "Speed: payouts in days instead of months. Transparency: trigger is objective data (from IMD, satellites, IoT sensors), not a subjective assessment. Lower cost: no claims investigation or adjustment expenses. Reduced moral hazard: you can't fake the weather. Ideal for catastrophe risk where traditional assessment is slow and difficult (floods, earthquakes, droughts)." },
        { label: "Limitations & basis risk", text: "The biggest challenge is 'basis risk' — the gap between the parametric trigger and your actual loss. If the rain gauge shows 80mm but your farm got 20mm, the parametric policy may not pay even though you suffered crop loss. Conversely, you might get paid when your actual loss was minimal. Designing triggers that closely match real losses requires granular weather station networks and actuarial sophistication. As IoT and satellite data improve, basis risk shrinks." },
      ]},
    { title: "Embedded Insurance", subtitle: "Buying insurance at the point of purchase — the future of distribution", duration: "4-min read",
      sections: [
        { label: "What is embedded insurance", text: "Embedded insurance means insurance cover is bundled directly into the purchase of a product or service — at the moment of buying. Think flight delay cover offered during ticket booking on MakeMyTrip, device protection added during a smartphone purchase on Flipkart, or ride insurance on Ola/Uber. The insurance is 'embedded' into the customer journey instead of being sold separately." },
        { label: "Why it's booming", text: "Distribution has always been insurance's biggest cost. Traditional agent-based selling is expensive (commissions of 15-40%). Embedded insurance slashes distribution cost because the product context is already there — the customer understands why they need cover. IRDAI's sandbox regulations and InsurTech partnerships have accelerated embedded insurance in India. Acko, Digit, and Go Digit are leaders in this space." },
        { label: "Common examples in India", text: "Travel portals: trip cancellation and flight delay cover. E-commerce: mobile/laptop screen damage protection, extended warranty. Ride-hailing: ride insurance covering accidents during trips. Fintech: UPI transaction fraud cover. Lending: group credit life insurance embedded in personal loan disbursement. Rental platforms: tenant liability cover. Electronics: accidental damage cover at checkout." },
        { label: "IRDAI's stance", text: "IRDAI has been supportive of embedded insurance, recognizing it as a way to boost insurance penetration. The 2024 regulations on web aggregators and the Point of Sale (PoS) framework enable non-insurance platforms to distribute simple insurance products. Key requirement: the insurance component must be clearly disclosed, voluntary (not bundled without consent), and underwritten by a licensed insurer. IRDAI's Bima Sugam platform may further enable embedded insurance at scale." },
      ]},
    { title: "Pet Insurance", subtitle: "Health cover for your furry family members", duration: "3-min read",
      sections: [
        { label: "What it covers", text: "Pet insurance covers veterinary treatment costs for dogs and cats (and sometimes exotic pets) in case of accidents, illnesses, and surgeries. Some policies also cover third-party liability (if your pet bites someone), theft or straying, death due to accident or illness, and even boarding fees if the owner is hospitalized. It works similarly to human health insurance — you pay a premium and the insurer reimburses vet bills." },
        { label: "The Indian market", text: "Pet insurance is still nascent in India but growing fast. India's pet population has surged to over 30 million dogs and 8 million cats. Rising pet parenting expenditure (₹800-1,500/month on veterinary care alone) is driving demand. Insurers like Bajaj Allianz, ICICI Lombard (through partnerships with platforms like Supertails), and startups like PawSafe are offering pet health covers ranging from ₹25,000 to ₹1 lakh per year." },
        { label: "Key considerations", text: "Breed matters: premiums for high-risk breeds (Bulldogs, Pugs, German Shepherds) are higher due to breed-specific health conditions. Age limits: most policies only cover pets aged 3 months to 8-10 years. Waiting periods: typically 14-30 days for illness claims. Pre-existing conditions: generally excluded just like human health insurance. Vaccination records: many insurers require proof of up-to-date vaccinations to issue and renew the policy." },
        { label: "Future outlook", text: "As pet ownership grows and veterinary costs rise, pet insurance is expected to grow at 15-20% CAGR in India. IRDAI has been exploring standalone pet insurance product guidelines. The trend toward humanization of pets (treating pets as family members), combined with increasing availability of advanced (and expensive) veterinary treatments like chemotherapy and orthopaedic surgery, will make pet insurance more mainstream." },
      ]},
    { title: "Surety Insurance", subtitle: "IRDAI's game-changer for infrastructure contracts", duration: "4-min read",
      sections: [
        { label: "What is surety insurance", text: "Surety insurance (or surety bonds) is a three-party agreement: the principal (contractor), the obligee (project owner, usually the government), and the surety (insurer). The insurer guarantees that the contractor will fulfill their obligations under a contract. If the contractor defaults, the insurer compensates the project owner. Think of it as 'performance guarantee insurance' — it replaces the traditional bank guarantee system." },
        { label: "Why IRDAI introduced it", text: "In 2022, IRDAI allowed general insurers to issue surety bonds — a historic move. Previously, contractors had to furnish bank guarantees for government infrastructure projects, which locked up their bank credit limits and working capital. A ₹100 crore project might require a ₹10-20 crore bank guarantee, tying up capital that could be used for additional projects. Surety insurance frees up this capital." },
        { label: "Impact on infrastructure", text: "Surety insurance is a game-changer for MSMEs and mid-size contractors who struggle to obtain bank guarantees. It boosts contractor capacity — firms can bid for more projects simultaneously. NHAI (National Highways Authority), railways, and smart city projects are increasingly accepting surety bonds alongside bank guarantees. Global markets (US, Europe) run almost entirely on surety bonds; India is catching up." },
        { label: "How it works in practice", text: "The contractor pays an annual premium (typically 1-3% of the bond value) to the insurer. If the contractor fails to perform, the insurer pays the obligee. The insurer then recovers from the contractor (surety insurance gives the insurer recourse against the principal — unlike regular insurance). Key types: bid bonds (guaranteeing the contractor will honor their bid), performance bonds (guaranteeing project completion), and advance payment bonds (guaranteeing proper use of advances)." },
      ]},
    { title: "Catastrophe Insurance & Natural Disaster Cover", subtitle: "Insurance against earthquakes, cyclones, floods, and mega-events", duration: "4-min read",
      sections: [
        { label: "What is catastrophe insurance", text: "Catastrophe insurance (Cat insurance) covers losses from large-scale natural or man-made disasters — earthquakes, cyclones, floods, tsunamis, volcanic eruptions, and terrorism. Unlike regular property insurance which covers individual claims, catastrophe insurance deals with correlated losses where thousands of policies are hit simultaneously by a single event. This makes catastrophe risk fundamentally different from regular risk and requires specialized products, pricing, and capital backing." },
        { label: "India's catastrophe exposure", text: "India is among the world's most disaster-prone countries. 58.6% of India's landmass is prone to earthquakes (including the entire Himalayan belt, northeast India, and Gujarat). 12% of land is prone to floods. 8% of the area is cyclone-prone (eastern and western coastlines). India experiences 2-3 major natural disasters annually on average. The 2001 Gujarat earthquake caused ₹13,805 crore in losses; the 2018 Kerala floods caused ₹40,000 crore. Yet insured losses are typically less than 5% of economic losses." },
        { label: "Existing frameworks", text: "India does not yet have a dedicated national catastrophe insurance scheme. Cover is available through: Standard Fire and Special Perils (SFSP) policies (which include earthquake and flood cover but have low uptake), crop insurance under PMFBY (which covers weather catastrophes for farmers), and the National Disaster Response Fund (NDRF) which provides government relief. IRDAI has been studying a National Catastrophe Insurance Pool — a government-backed fund that would aggregate catastrophe risk and provide affordable cover." },
        { label: "The case for a Cat Pool", text: "Countries like Turkey (TCIP), Japan (JER), New Zealand (EQC), and the Caribbean (CCRIF) have national catastrophe pools that provide affordable, mandatory or opt-in disaster cover. India needs one urgently — without it, every disaster triggers fiscal shocks to the government, delayed and inadequate relief, and devastating uninsured losses for families. A well-designed Indian Cat Pool could combine mandatory earthquake cover for urban property with subsidized flood cover for rural areas, backed by international reinsurance and Cat Bonds." },
      ]},
    { title: "Flood Insurance", subtitle: "India's most frequent natural peril and how to insure against it", duration: "4-min read",
      sections: [
        { label: "The scale of flood risk", text: "Floods are India's most frequent and destructive natural disaster. Between 2015 and 2024, major flood events struck Kerala (2018, 2024), Uttarakhand (2013, 2023), Assam (annually), Chennai (2015, 2023), Mumbai (repeatedly), and Himachal Pradesh (2023). Average annual flood damage in India exceeds ₹20,000 crore. Climate change is intensifying rainfall events — 'once in a century' floods now occur every few years in many regions." },
        { label: "How flood cover works in India", text: "Standalone flood insurance doesn't exist in India. Flood damage is covered under the Standard Fire and Special Perils (SFSP) policy — but only if you have one. Home insurance (which includes SFSP) penetration is below 1%. Motor comprehensive policies cover flood damage to vehicles (critical in Mumbai, Chennai, Bangalore). Crop insurance under PMFBY covers flood damage to crops. Commercial properties and factories can add flood cover through industrial all-risk policies." },
        { label: "Key gaps and challenges", text: "Most Indian homeowners have zero flood cover — they rely entirely on government relief and personal savings. Even those with SFSP policies face challenges: sum insured may be inadequate (based on outdated property values), contents cover is often excluded, and claims processing after large floods is slow due to the sheer volume. Flood risk mapping in India is underdeveloped compared to FEMA's flood maps in the US — this makes risk-based pricing difficult for insurers." },
        { label: "What needs to change", text: "India needs flood risk zones mapped at granular (pin-code) level using satellite and drainage data. Mandatory flood insurance for properties in high-risk zones (as the US NFIP requires for federally-backed mortgages). Affordable parametric flood products that trigger payouts based on river gauge levels or satellite-detected inundation — no claims assessment needed. Community-based flood insurance pools for rural areas. Until these exist, the minimum step: ensure your home insurance policy includes SFSP cover and your motor policy is comprehensive, not third-party only." },
      ]},
    { title: "Renewable Energy Insurance", subtitle: "Covering solar, wind, and the green transition", duration: "4-min read",
      sections: [
        { label: "Why it's a growing market", text: "India aims for 500 GW of non-fossil fuel energy capacity by 2030. Solar parks, wind farms, rooftop solar, biomass plants, and green hydrogen facilities represent billions in infrastructure investment — all needing insurance. Renewable energy insurance is one of the fastest-growing segments in the Indian general insurance market, driven by government policy (PM-KUSUM for solar, offshore wind targets) and corporate ESG commitments." },
        { label: "What's covered", text: "Property damage: covers solar panels, wind turbines, inverters, batteries, and balance-of-system equipment against fire, storms, lightning, theft, and equipment breakdown. Business interruption: covers lost revenue when generation stops due to an insured event. Third-party liability: covers injury or property damage caused by the installation (a wind turbine blade fragment, a solar panel fire spreading). Transit insurance: covers equipment during transportation to site. Erection All Risk: covers the installation/construction phase." },
        { label: "Unique risks", text: "Solar panels face hail damage, soiling, hotspot failure, and theft (in remote installations). Wind turbines face blade damage from lightning and storms, gearbox failure, and foundation issues. Both face grid connectivity risk — if the grid operator curtails power purchase, revenue drops. Weather variability means actual generation can be 20-30% below projections, affecting loan repayments. Emerging risks: battery energy storage system (BESS) fires, which are notoriously difficult to extinguish." },
        { label: "The opportunity for India", text: "With ₹30+ lakh crore needed in renewable energy investment by 2030, the insurance premium pool for renewables could reach ₹5,000-8,000 crore annually. Specialized renewable energy insurance requires expertise in weather risk, technology risk, and long-term performance guarantees. Indian insurers are partnering with global reinsurers (Swiss Re, Munich Re) to build capacity. For BFSI professionals, renewable energy insurance is a high-growth career niche combining insurance knowledge with clean energy expertise." },
      ]},
  ],
  "Glossary": [
    { title: "Key Insurance Terms A–Z", subtitle: "200+ terms explained in plain language", duration: "Reference",
      sections: [
        { label: "A–C", text: "Actuary: The mathematician who calculates insurance risks and premiums. Adverse Selection: When higher-risk individuals are more likely to buy insurance, skewing the risk pool. Annuity: Regular income payments, usually post-retirement. Assignment: Transferring policy rights to another person. Bancassurance: Sale of insurance products through bank channels. BIMA Sugam: IRDAI's proposed unified digital insurance platform. Broker: Licensed intermediary who represents the buyer, not the insurer. Catastrophe Bond (Cat Bond): Security that transfers catastrophe risk to capital markets. Claim Ratio/Incurred Claim Ratio: Claims paid as percentage of premiums earned. Co-payment/Co-pay: The percentage of a claim amount you must pay yourself. Combined Ratio: Sum of loss ratio and expense ratio — below 100% means underwriting profit. Commutation: Settlement of all future obligations with a single lump-sum payment." },
        { label: "D–G", text: "Deductible: Fixed amount you pay before insurance kicks in. Earned Premium: Portion of premium covering the expired policy period. Endorsement: Written amendment to an insurance policy changing its terms. Endowment: Policy combining protection with savings. Excess: Amount of each claim the policyholder bears (similar to deductible). Expense Ratio: Operating expenses as percentage of net premiums — measures insurer efficiency. Facultative Reinsurance: Reinsurance arranged individually for specific risks. Float: Premium money held by insurers before paying claims — invested for income. Free Look Period: 15-30 day window to cancel a new policy for a full refund. Grace Period: Extra time (usually 30 days) to pay overdue premiums before policy lapses. Guaranteed Surrender Value (GSV): Minimum amount payable on early exit, set by formula." },
        { label: "H–M", text: "Hazard: Condition that increases the probability or severity of a loss. IDV (Insured Declared Value): Current market value of a vehicle for insurance purposes. Indemnity: Compensation to restore you to your pre-loss financial position — you cannot profit from a claim. Insurable Interest: You must stand to suffer a financial loss from the insured event. Lapse: Policy termination due to non-payment of premiums. Loading: Extra premium charged for higher-than-normal risk (age, health, occupation). Loss Ratio: Claims incurred as a percentage of premiums earned — a key profitability metric. Moral Hazard: Risk that having insurance encourages reckless or dishonest behavior. Mortality Charge: The cost of pure life cover deducted from ULIP/traditional policy premiums. Nomination: Designating who receives policy benefits on your death. No Claim Bonus (NCB): Premium discount earned for each claim-free year." },
        { label: "N–S", text: "Paid-up Value: Reduced cover if you stop paying premiums but don't surrender. Peril: The specific cause of loss (fire, flood, theft, death). Persistency Ratio: Percentage of policies still active after a given period — measures customer retention. Premium: The price of insurance coverage. Proposal Form: Application form for insurance — misstatements here can void claims. Reinstatement: Reviving a lapsed policy, usually requiring back premiums and medical examination. Reinsurance: Insurance for insurance companies — transfers risk from primary insurer to reinsurer. Rider: Optional add-on coverage (accidental death, critical illness, waiver of premium). Risk Pooling: Core insurance principle — many contribute small amounts so few who suffer losses can be compensated. Solvency Ratio: Insurer's available capital vs required capital — IRDAI minimum is 150%. Subrogation: Insurer's right to pursue the party that caused the insured loss to recover the claim amount paid. Sum Assured: The guaranteed payout amount specified in the policy. Surrender Value: Amount received on early policy exit — GSV or Special SV, whichever is higher." },
        { label: "T–Z", text: "Term Insurance: Pure life cover with no savings component — cheapest form of life insurance. Third Party Administrator (TPA): Company authorized by IRDAI to manage health insurance claims on behalf of insurers. Treaty Reinsurance: Automatic reinsurance covering an entire class of policies. ULIP: Unit-Linked Insurance Plan — insurance + market-linked investment in one product. Underwriting: Risk assessment process before issuing a policy — determines premium and terms. Underwriting Profit: Profit from insurance operations alone (premiums minus claims and expenses), excluding investment income. Utmost Good Faith (Uberrima Fides): Legal principle requiring both parties to disclose all material facts honestly. Vesting Age: Age at which pension benefits become the policyholder's right. Waiting Period: Time after policy purchase during which certain claims are excluded. Whole Life Policy: Life insurance that covers the insured for their entire lifetime, not a fixed term." },
      ]},
  ],

// ── Concept text rendering ──
function renderConceptText(text) {
  const keys = Object.keys(CONCEPTS).sort((a, b) => b.length - a.length);
  let html = '', remaining = text, guard = 0;
  while (remaining.length && guard < 500) {
    guard++;
    let hitIdx = -1, hitKey = null;
    for (const k of keys) {
      const i = remaining.toLowerCase().indexOf(k);
      if (i !== -1 && (hitIdx === -1 || i < hitIdx)) { hitIdx = i; hitKey = k; }
    }
    if (hitIdx === -1) { html += esc(remaining); break; }
    if (hitIdx > 0) html += esc(remaining.slice(0, hitIdx));
    html += `<button class="concept-chip" onclick="openConcept('${hitKey}')">${esc(remaining.slice(hitIdx, hitIdx + hitKey.length))}</button>`;
    remaining = remaining.slice(hitIdx + hitKey.length);
  }
  return html;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Navigation ──
let currentTrack = null;
let currentLessonIdx = 0;

function navigate(screen) {
  const area = document.getElementById('scrollArea');
  scrollPositions[currentScreen] = window.scrollY;
  currentScreen = screen;
  render();
  window.scrollTo(0, scrollPositions[screen] || 0);
  updateTabs();
}

function switchTab(tab) {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  if (tab === 'briefing') { activeTag = 'All'; navigate('briefing'); }
  else if (tab === 'pathshala') navigate('pathshala');
  else if (tab === 'bfsi') { activeBFSITag = 'All'; navigate('bfsi'); }
  else if (tab === 'regs') navigate('regs');
  else if (tab === 'more') navigate('more');
}

function filterByTag(tag) { activeTag = tag; navigate('briefing'); }
function filterBFSIByTag(tag) { activeBFSITag = tag; navigate('bfsi'); }
function openBFSIArticle(idx) { selectedArticle = idx; navigate('bfsi-detail'); }
function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim();
  clearTimeout(handleSearch._t);
  handleSearch._t = setTimeout(() => {
    if (currentScreen === 'briefing') renderBriefing();
    else if (currentScreen === 'bfsi') renderBFSI();
  }, 350);
}

function openArticle(idx) { selectedArticle = idx; navigate('article-detail'); }

function openTrack(name) { currentTrack = name; navigate('track'); }
function openLesson(trackName, idx) {
  currentTrack = trackName;
  currentLessonIdx = idx;
  navigate('lesson');
}
function openLessonFor(conceptKey) {
  const c = CONCEPTS[conceptKey];
  if (!c || !c.track) { navigate('pathshala'); return; }
  openTrack(c.track);
}

function render() {
  switch (currentScreen) {
    case 'briefing': renderBriefing(); break;
    case 'article-detail': renderArticle(liveArticles[selectedArticle]); break;
    case 'bfsi': renderBFSI(); break;
    case 'bfsi-detail': renderBFSIArticle(bfsiArticles[selectedArticle]); break;
    case 'pathshala': renderPathshala(); break;
    case 'track': renderTrack(currentTrack); break;
    case 'lesson': renderLesson(currentTrack, currentLessonIdx); break;
    case 'regs': renderComingSoon('Regulatory Updates', '📋', 'A curated tracker of IRDAI regulations, circulars, and reform updates is being built. Launching soon!'); break;
    case 'more': renderComingSoon('More Features', '⚙️', 'Bookmarks, reading history, dark mode, and notification settings are in development. We\'ll have them ready soon!'); break;
    default: renderComingSoon('Coming Soon', '🚀', 'This feature is being crafted for you. Check back soon!');
  }
}

function updateTabs() {
  const map = {
    'article-detail': 'briefing', 'briefing': 'briefing',
    'bfsi': 'bfsi', 'bfsi-detail': 'bfsi',
    'lesson': 'pathshala', 'track': 'pathshala', 'pathshala': 'pathshala',
  };
  const activeTabId = map[currentScreen] || currentScreen;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === activeTabId);
  });
}

// ── Sheet ──
function openConcept(key) {
  const c = CONCEPTS[key];
  if (!c) return;
  lastOpenedConcept = key;
  document.getElementById('sheetTerm').textContent = c.term;
  document.getElementById('sheetBody').textContent = c.micro;
  document.getElementById('sheetOverlay').style.display = 'block';
  document.getElementById('sheet').style.display = 'block';
  requestAnimationFrame(() => {
    document.getElementById('sheetOverlay').classList.add('visible');
    document.getElementById('sheet').classList.add('open');
  });
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('visible');
  document.getElementById('sheet').classList.remove('open');
  setTimeout(() => {
    document.getElementById('sheetOverlay').style.display = 'none';
    document.getElementById('sheet').style.display = 'none';
  }, 240);
}

// ── Save & Share ──
function toggleSave(btn, title) {
  if (savedArticles.has(title)) {
    savedArticles.delete(title);
    btn.textContent = '♡ Save';
    btn.classList.remove('saved');
  } else {
    savedArticles.add(title);
    btn.textContent = '♥ Saved';
    btn.classList.add('saved');
  }
}

function shareArticle() {
  const article = liveArticles[selectedArticle];
  if (!article) return;
  if (navigator.share) {
    navigator.share({ title: article.title, text: article.dek, url: article.link !== '#' ? article.link : window.location.href });
  } else {
    const text = `${article.title}\n\n${article.dek}\n\nRead more on InsuralIQ`;
    navigator.clipboard.writeText(text).then(() => alert('Article link copied to clipboard!'));
  }
}

// ── Init ──
renderBriefing();
</script>
