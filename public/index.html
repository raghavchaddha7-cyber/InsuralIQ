<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsuralIQ — Insurance Knowledge Platform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal: #0E7C86;
  --teal-dark: #0A5A62;
  --teal-soft: #E4F1F1;
  --coral: #FF6B5B;
  --coral-soft: #FFEDE9;
  --bg: #FBFAF7;
  --card: #FFFFFF;
  --ink: #1A2B32;
  --sub: #5B6B70;
  --line: #ECE9E2;
  --font: 'Inter', system-ui, sans-serif;
  --display: 'Fraunces', Georgia, serif;
  --max-w: 520px;
}

html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  padding-bottom: 72px; /* space for bottom nav */
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 0 16px;
}
.header-inner {
  max-width: var(--max-w); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
}
.header .brand {
  font: 700 20px var(--display); color: var(--teal); letter-spacing: -0.3px;
  text-decoration: none;
}
.header .live-badge {
  font: 600 10px var(--font); color: var(--coral);
  display: flex; align-items: center; gap: 4px;
}

.search-bar { padding: 8px 16px 12px; background: var(--bg); }
.search-bar-inner {
  max-width: var(--max-w); margin: 0 auto;
  display: flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
}
.search-bar-inner input {
  border: none; outline: none; font: 400 14px var(--font); color: var(--ink);
  background: none; flex: 1; width: 100%;
}
.search-bar-inner input::placeholder { color: var(--sub); }

/* ── Main Content ── */
.main { max-width: var(--max-w); margin: 0 auto; padding: 0 16px; }

/* ── Bottom Nav ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  height: 64px; background: #fff; border-top: 1px solid var(--line);
  display: flex; max-width: 100%;
}
.tab-btn {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding-top: 9px; opacity: 0.45; transition: opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { opacity: 1; }
.tab-btn .tab-icon { font-size: 18px; }
.tab-btn:not(.active) .tab-icon { filter: grayscale(1); }
.tab-btn .tab-label { font: 600 10px var(--font); color: var(--sub); }
.tab-btn.active .tab-label { color: var(--teal); }

/* ── Shared ── */
.back-btn {
  font: 600 14px var(--font); color: var(--teal); background: none; border: none;
  padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.pill {
  font: 600 10.5px var(--font); letter-spacing: 0.7px; text-transform: uppercase;
  padding: 4px 9px; border-radius: 7px; display: inline-block; white-space: nowrap;
}
.section-label {
  font: 600 11px var(--font); letter-spacing: 1px; text-transform: uppercase;
  color: var(--teal); margin: 2px 0 7px;
}
.section-label.accent { color: var(--coral); }
.body-text { font: 400 15px/1.65 var(--font); color: var(--ink); margin: 0 0 18px; }
.concept-chip {
  color: var(--coral); background: none; border: none;
  border-bottom: 1.5px dotted var(--coral); padding: 0;
  font: inherit; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ── Briefing Cards ── */
.briefing-card {
  display: block; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 15px 16px 14px; margin-bottom: 10px;
  cursor: pointer; box-shadow: 0 1px 2px rgba(20,40,45,0.04);
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.briefing-card:hover { border-color: var(--teal); box-shadow: 0 2px 8px rgba(14,124,134,0.08); }
.briefing-card .card-top {
  display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
  flex-wrap: nowrap; overflow: hidden;
}
.briefing-card .card-tag {
  font: 600 10px var(--font); letter-spacing: 0.7px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
}
.briefing-card .india-dot {
  font: 600 9px var(--font); color: var(--coral); letter-spacing: 0.5px;
  white-space: nowrap; flex-shrink: 0;
}
.briefing-card .concept-count {
  font: 500 9px var(--font); color: var(--teal); background: var(--teal-soft);
  padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
}
.briefing-card .card-time {
  margin-left: auto; font: 400 11px var(--font); color: var(--sub);
  white-space: nowrap; flex-shrink: 0;
}
.briefing-card .card-title {
  font: 600 16px/1.32 var(--font); color: var(--ink); letter-spacing: -0.2px;
}
.briefing-card .card-dek {
  font: 400 13.5px/1.4 var(--font); color: var(--sub); margin-top: 5px;
}
.briefing-card .card-footer {
  display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
}
.briefing-card .card-source { font: 400 11px var(--font); color: var(--sub); opacity: 0.7; }
.briefing-card .read-more { font: 600 12px var(--font); color: var(--teal); }

/* ── Tag Filter Strip ── */
.tag-strip {
  display: flex; gap: 6px; padding: 0 0 10px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tag-strip::-webkit-scrollbar { height: 0; }
.tag-pill {
  font: 600 11px var(--font); padding: 6px 13px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--card);
  cursor: pointer; white-space: nowrap; color: var(--sub); transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tag-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }

/* ── Loading ── */
.loading { text-align: center; padding: 50px 20px; color: var(--sub); font: 400 14px var(--font); }
.loading .spinner {
  width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--teal);
  border-radius: 50%; margin: 0 auto 12px; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Live dot ── */
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--coral);
  display: inline-block; margin-right: 4px; animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Track Card ── */
.track-card {
  display: flex; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
  transition: border-color 0.2s; -webkit-tap-highlight-color: transparent;
}
.track-card:hover { border-color: var(--teal); }
.track-bar { width: 5px; height: 32px; border-radius: 3px; margin-right: 14px; flex-shrink: 0; }
.track-card .track-name { font: 600 15px var(--font); color: var(--ink); }
.track-card .track-count { font: 400 12px var(--font); color: var(--sub); margin-top: 2px; }
.track-card .track-open { font: 600 12px var(--font); color: var(--teal); margin-left: auto; white-space: nowrap; }

/* ── Callout ── */
.callout { background: var(--teal-soft); border-radius: 14px; padding: 14px 16px; margin: 4px 0 18px; }
.callout .callout-title { font: 600 12px var(--font); color: var(--teal-dark); margin-bottom: 4px; }
.callout .callout-body { font: 400 13.5px/1.5 var(--font); color: var(--ink); }

/* ── Learn Card ── */
.learn-card {
  display: block; width: 100%; text-align: left;
  background: var(--teal-soft); border: 1px solid #CFE6E6;
  border-radius: 14px; padding: 14px 16px; margin-top: 16px; cursor: pointer;
  text-decoration: none; transition: border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.learn-card:hover { border-color: var(--teal); }
.learn-card.coral { background: var(--coral-soft); border-color: #FFD9D2; }
.learn-card.coral:hover { border-color: var(--coral); }
.learn-card .lc-overline { font: 600 11px var(--font); letter-spacing: 0.7px; text-transform: uppercase; }
.learn-card .lc-title { font: 600 15px var(--font); color: var(--ink); margin: 4px 0 2px; }
.learn-card .lc-sub { font: 400 13px var(--font); color: var(--sub); }

/* ── Action buttons ── */
.action-btn {
  font: 600 13px var(--font); color: var(--sub); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px; background: none; cursor: pointer;
  transition: all 0.2s; -webkit-tap-highlight-color: transparent;
}
.action-btn:hover { border-color: var(--teal); color: var(--teal); }
.action-btn.saved { color: var(--coral); border-color: var(--coral); background: var(--coral-soft); }

.rel-chip {
  font: 500 12.5px var(--font); color: var(--teal-dark); background: var(--teal-soft);
  padding: 6px 11px; border-radius: 20px; display: inline-block; cursor: pointer;
  transition: background 0.2s; border: none; -webkit-tap-highlight-color: transparent;
}
.rel-chip:hover { background: #D0E8E8; }

/* ── Coming Soon ── */
.coming-soon {
  text-align: center; padding: 60px 20px;
}
.coming-soon .cs-icon { font-size: 42px; margin-bottom: 14px; }
.coming-soon h2 { font: 600 22px var(--display); color: var(--ink); margin-bottom: 8px; }
.coming-soon p { font: 400 14px/1.5 var(--font); color: var(--sub); max-width: 300px; margin: 0 auto; }

/* ── Bottom Sheet ── */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(20,35,42,0.4);
  opacity: 0; transition: opacity 0.22s ease; z-index: 50; display: none;
}
.sheet-overlay.visible { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: #fff; border-radius: 22px 22px 0 0;
  padding: 16px 20px 30px; max-width: 520px; margin: 0 auto;
  transform: translateY(100%); transition: transform 0.24s cubic-bezier(0.3,0.8,0.3,1);
  box-shadow: 0 -10px 40px rgba(20,35,42,0.2); z-index: 51; display: none;
  max-height: 75vh; overflow-y: auto;
}
.sheet.open { transform: translateY(0); }
.sheet-header { display: flex; align-items: flex-start; justify-content: space-between; }
.sheet .sheet-label { font: 600 10px var(--font); letter-spacing: 0.8px; color: var(--coral); text-transform: uppercase; }
.sheet .sheet-term { font: 600 19px var(--display); color: var(--ink); margin-top: 3px; }
.sheet .close-btn {
  width: 32px; height: 32px; border-radius: 16px; border: none;
  background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer;
  line-height: 32px; text-align: center; flex-shrink: 0;
}
.sheet .sheet-body { font: 400 14.5px/1.58 var(--font); color: var(--ink); margin: 12px 0 16px; }
.sheet .sheet-cta {
  width: 100%; background: var(--teal); color: #fff; border: none;
  border-radius: 13px; padding: 13px; font: 600 14.5px var(--font); cursor: pointer;
}
.sheet .sheet-hint { font: 500 11.5px var(--font); color: var(--sub); text-align: center; margin-top: 10px; }

/* ── Article full content ── */
.article-content { font: 400 15px/1.7 var(--font); color: var(--ink); }
.article-content p { margin-bottom: 16px; }

/* ── Footer info ── */
.footer-info {
  text-align: center; padding: 16px; font: 400 11px var(--font); color: var(--sub); opacity: 0.5;
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="#" class="brand" onclick="switchTab('briefing');return false">InsuralIQ</a>
    <div class="live-badge"><span class="live-dot"></span>Live</div>
  </div>
</header>

<!-- Search -->
<div class="search-bar">
  <div class="search-bar-inner">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search news, concepts, companies…" oninput="handleSearch()">
  </div>
</div>

<!-- Main Content Area -->
<div class="main" id="scrollArea"></div>

<!-- Bottom Nav -->
<nav class="bottom-nav" id="bottomNav">
  <button class="tab-btn active" data-tab="briefing" onclick="switchTab('briefing')"><span class="tab-icon">📰</span><span class="tab-label">Briefing</span></button>
  <button class="tab-btn" data-tab="pathshala" onclick="switchTab('pathshala')"><span class="tab-icon">📚</span><span class="tab-label">Pathshala</span></button>
  <button class="tab-btn" data-tab="companies" onclick="switchTab('companies')"><span class="tab-icon">🏢</span><span class="tab-label">Companies</span></button>
  <button class="tab-btn" data-tab="regs" onclick="switchTab('regs')"><span class="tab-icon">📋</span><span class="tab-label">Regs</span></button>
  <button class="tab-btn" data-tab="more" onclick="switchTab('more')"><span class="tab-icon">⋯</span><span class="tab-label">More</span></button>
</nav>

<!-- Bottom Sheet (concept explainer) -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-header">
    <div>
      <div class="sheet-label">Quick explainer</div>
      <div class="sheet-term" id="sheetTerm"></div>
    </div>
    <button class="close-btn" onclick="closeSheet()">×</button>
  </div>
  <p class="sheet-body" id="sheetBody"></p>
  <button class="sheet-cta" onclick="closeSheet(); setTimeout(()=>openLessonFor(lastOpenedConcept),240)">Read full lesson →</button>
  <div class="sheet-hint">Tap × to return exactly where you were reading</div>
</div>

<script>
// ── Config ──
const API_BASE = window.location.origin;

// ── Concept Data ──
const CONCEPTS = {
  "surrender value": { term: "Surrender value", micro: "The amount a life insurer pays you if you end your policy before it matures. It's usually less than the premiums you've paid, since early premiums cover costs and your life cover. You receive the higher of two calculations — the Guaranteed Surrender Value or the Special Surrender Value. Since 1 October 2024, IRDAI requires insurers to pay a surrender value even after just one year of premiums, reversing the old rule where first-year exits got nothing.", track: "Life Insurance" },
  "endowment plans": { term: "Endowment plans", micro: "A life insurance policy that combines protection with savings. You get a life cover, and if you survive the term, you receive a maturity payout. Premiums are higher than pure term insurance because part of your money is being saved and invested on your behalf.", track: "Life Insurance" },
  "paid-up value": { term: "Paid-up value", micro: "If you stop paying premiums but don't surrender, your policy may continue with a reduced sum assured — this lower amount is the paid-up value. The cover doesn't vanish; it shrinks in proportion to the premiums you actually paid.", track: "Life Insurance" },
  "premium": { term: "Premium", micro: "The amount you pay to the insurer — periodically or as a lump sum — to keep your policy active. Premiums are calculated based on the risk the insurer covers, your age, health, and the type and tenure of the policy.", track: "Insurance Basics" },
  "underwriting": { term: "Underwriting", micro: "The insurer's process of evaluating your risk profile before accepting you for coverage. They assess factors like your age, medical history, occupation, and lifestyle to decide the terms and premium.", track: "Insurance Basics" },
  "claim ratio": { term: "Claim ratio", micro: "The percentage of claims an insurer pays out versus the total claims received. A higher claim settlement ratio generally indicates that the insurer is more likely to honour legitimate claims.", track: "Insurance Basics" },
  "solvency ratio": { term: "Solvency ratio", micro: "A measure of an insurer's financial strength — the ratio of available assets to required solvency margin. IRDAI mandates a minimum of 150%, meaning the insurer must hold 1.5× the capital needed to cover obligations.", track: "Insurance Basics" },
  "term insurance": { term: "Term insurance", micro: "The simplest form of life insurance — pure risk cover with no savings or investment component. If the policyholder dies during the term, the nominee receives the sum assured. If the term expires, nothing is paid out (unless it's a return-of-premium variant).", track: "Life Insurance" },
  "sum assured": { term: "Sum assured", micro: "The guaranteed amount the insurer promises to pay on the occurrence of the insured event (death, maturity, or diagnosis of critical illness). It's the core of any life insurance policy and determines the premium you pay.", track: "Life Insurance" },
  "cashless claim": { term: "Cashless claim", micro: "A health insurance feature where the insurer pays the hospital directly, so you don't have to pay upfront and then seek reimbursement. Available only at network hospitals that have a tie-up with your insurer or TPA.", track: "Health Insurance" },
  "deductible": { term: "Deductible", micro: "The fixed amount you agree to pay out of pocket before your insurance kicks in. A higher deductible usually means a lower premium. Common in health and motor insurance.", track: "Health Insurance" },
  "reinsurance": { term: "Reinsurance", micro: "Insurance for insurance companies. Primary insurers transfer part of their risk to reinsurers to protect their balance sheets against large or catastrophic losses. GIC Re is India's sole domestic reinsurer.", track: "General Insurance" },
  "annuity": { term: "Annuity", micro: "A financial product that provides regular income payments, typically after retirement. You pay a lump sum or series of premiums, and the insurer pays you a regular pension for life or a fixed period.", track: "Life Insurance" },
  "rider": { term: "Rider", micro: "An optional add-on to a base insurance policy that provides additional coverage for specific risks — like accidental death benefit, critical illness cover, or waiver of premium on disability.", track: "Insurance Basics" },
  "free look period": { term: "Free look period", micro: "A 15-30 day window after receiving your policy document during which you can cancel the policy and get a full refund (minus proportional risk charges and stamp duty) if you're not satisfied with the terms.", track: "Insurance Basics" },
  "nomination": { term: "Nomination", micro: "The process of designating a person (nominee) who will receive the policy benefits in case of the policyholder's death. Nomination doesn't override a valid will — the nominee is a custodian of the proceeds until they're distributed to legal heirs.", track: "Insurance Basics" },
};

// ── Lesson Content for all tracks ──
const LESSONS = {
  "Insurance Basics": [
    { title: "What is Insurance?", subtitle: "The fundamental principle of risk transfer", duration: "3-min read",
      sections: [
        { label: "What it is", text: "Insurance is a contract between you and an insurer where you pay a premium in exchange for financial protection against specific risks. The core principle is risk pooling — many people contribute small amounts so that the few who face losses can be compensated." },
        { label: "Why it matters", text: "Without insurance, a single medical emergency, accident, or natural disaster could wipe out years of savings. Insurance converts unpredictable, potentially catastrophic financial losses into predictable, manageable premium payments." },
        { label: "How it works", text: "You pay a premium to the insurer. In return, the insurer promises to pay a specified amount if the insured event occurs. The insurer pools premiums from thousands of policyholders and uses actuarial science to calculate the probability of claims, ensuring the pool remains solvent." },
      ]},
    { title: "Types of Insurance in India", subtitle: "Life, Health, General — and how they differ", duration: "4-min read",
      sections: [
        { label: "Life Insurance", text: "Covers the risk of death. The insurer pays the sum assured to the nominee if the policyholder dies during the policy term. Types include term insurance (pure protection), endowment plans (protection + savings), ULIPs (protection + market-linked investment), and whole life policies." },
        { label: "Health Insurance", text: "Covers medical expenses — hospitalization, surgery, diagnostics, and sometimes outpatient treatment. Can be individual, family floater, or group policies. Key features include cashless claims at network hospitals, pre- and post-hospitalization cover, and no-claim bonuses." },
        { label: "General Insurance", text: "Everything else — motor insurance, home insurance, travel insurance, crop insurance, marine insurance, and liability insurance. These are typically annual contracts (unlike life insurance which can run decades) and cover property damage, theft, accidents, and legal liabilities." },
      ]},
    { title: "Understanding Premiums", subtitle: "How insurers calculate what you pay", duration: "4-min read",
      sections: [
        { label: "What it is", text: "The premium is the price you pay for insurance coverage. It can be a one-time payment (single premium), annual, semi-annual, quarterly, or monthly. The premium is determined by the level of risk you represent and the amount of coverage you want." },
        { label: "What affects your premium", text: "For life insurance: age, health, smoking status, occupation, policy term, and sum assured. For health insurance: age, pre-existing conditions, family medical history, city of residence, and chosen sum insured. For motor: vehicle type, age, city, and claims history (No Claim Bonus)." },
        { label: "Key insight", text: "Buying insurance early almost always means lower premiums. A term insurance policy bought at 25 can cost 40-50% less annually than the same policy bought at 35, because the risk of death at a younger age is statistically lower." },
      ]},
    { title: "How Insurance Companies Make Money", subtitle: "The business model behind your premium", duration: "4-min read",
      sections: [
        { label: "Underwriting profit", text: "Insurers collect premiums from policyholders and pay out claims. If total premiums collected exceed total claims paid plus operating expenses, the insurer earns an underwriting profit. The difference between premiums earned and claims incurred is tracked through the 'combined ratio' — a ratio below 100% means profitability." },
        { label: "Investment income", text: "Between collecting premiums and paying claims, insurers invest the money — this pool is called 'float.' Life insurers invest heavily in government bonds, corporate debt, and equities. In India, IRDAI mandates that a significant portion of investments go into government securities. This investment income often exceeds underwriting profit and is the real engine of insurance profitability." },
        { label: "Other revenue streams", text: "Insurers also earn through policy fees, fund management charges (in ULIPs), surrender charges on early exits, and commissions on reinsurance ceded. Bancassurance partnerships generate fee income for banks who distribute insurance products." },
        { label: "Why some insurers run at a loss", text: "Many general insurers, especially in motor insurance, operate with combined ratios above 100% — meaning they pay more in claims than they collect in premiums. They survive because investment income covers the gap. This is why interest rate movements and stock market performance directly affect insurer profitability." },
      ]},
    { title: "Reinsurance Explained", subtitle: "Insurance for insurance companies", duration: "4-min read",
      sections: [
        { label: "What is reinsurance", text: "Reinsurance is when an insurance company transfers part of its risk to another insurer (the reinsurer). If an insurer covers a ₹500 crore factory, it may keep ₹100 crore of risk and pass ₹400 crore to reinsurers. This prevents a single catastrophic claim from bankrupting the insurer." },
        { label: "Types of reinsurance", text: "Treaty reinsurance automatically covers all policies in a category (e.g., all fire policies above ₹10 crore). Facultative reinsurance is negotiated policy by policy for unusual or very large risks. Proportional treaties share premiums and claims in a fixed ratio; non-proportional (excess-of-loss) treaties only kick in when claims exceed a threshold." },
        { label: "Major reinsurers", text: "GIC Re (General Insurance Corporation of India) is India's sole domestic reinsurer and is among the top 15 globally. International giants include Munich Re, Swiss Re, and Berkshire Hathaway. IRDAI requires Indian insurers to offer at least 4% of every risk to GIC Re before approaching foreign reinsurers." },
        { label: "Why it matters to you", text: "Reinsurance capacity determines what risks insurers can cover. After major disasters (like the 2018 Kerala floods), reinsurance rates spike, which trickles down as higher premiums for end consumers. Understanding reinsurance helps explain why premiums rise after catastrophe years." },
      ]},
    { title: "Role of IRDAI", subtitle: "India's insurance watchdog and what it does", duration: "4-min read",
      sections: [
        { label: "What is IRDAI", text: "The Insurance Regulatory and Development Authority of India (IRDAI) is the apex body that regulates and promotes the insurance industry. Established in 1999 after the Malhotra Committee recommended opening up insurance to private players, IRDAI operates under the IRDAI Act, 1999." },
        { label: "Key functions", text: "IRDAI licenses insurers and intermediaries, approves insurance products and premium rates, sets solvency margin requirements (minimum 150%), mandates investment norms for policyholder funds, and handles policyholder grievances. It also oversees the Insurance Ombudsman system for dispute resolution." },
        { label: "Recent reforms", text: "IRDAI has been actively modernizing: allowing 100% FDI in insurance (2024), introducing sandbox regulations for InsurTech innovations, mandating standardized health insurance products (Arogya Sanjeevani), implementing the 'Insurance for All by 2047' vision, and enabling direct online sales through the BIMA Sugam digital platform." },
        { label: "For students", text: "Understanding IRDAI regulations is essential for anyone entering the BFSI sector. Key circulars to know: expense of management (EOM) limits, commission structures, product filing guidelines, and the distinction between insurance agents, brokers, corporate agents, and web aggregators." },
      ]},
    { title: "Insurance Distribution Channels", subtitle: "Agents, brokers, bancassurance & digital — how insurance reaches you", duration: "5-min read",
      sections: [
        { label: "Individual agents", text: "The traditional backbone of insurance distribution in India. Agents are licensed by IRDAI and work exclusively for one life insurer and one general insurer. They earn commission on every policy sold — typically 15-35% of first-year premium for life insurance and 10-15% for general insurance. India has over 27 lakh registered insurance agents." },
        { label: "Brokers", text: "Unlike agents who represent insurers, brokers represent the customer. They can sell products from multiple insurers and are expected to recommend the best-fit policy. Brokers are particularly important in commercial insurance (large corporate policies). They earn brokerage fees and must maintain higher capital requirements than agents." },
        { label: "Bancassurance", text: "Banks sell insurance products to their existing customer base — leveraging trust and reach. This channel has grown rapidly, now contributing over 50% of new life insurance business for some insurers. Banks earn referral fees, and customers benefit from convenience. IRDAI allows banks to partner with up to 9 insurers (3 life, 3 general, 3 health)." },
        { label: "Digital & InsurTech", text: "Online platforms like Policybazaar, Digit Insurance, and Acko have transformed insurance buying. Web aggregators compare policies across insurers. Point-of-sale (PoS) channels offer simple products with minimal documentation. IRDAI's BIMA Sugam initiative aims to create a unified digital platform — an 'insurance UPI' — for buying, servicing, and claiming." },
      ]},
    { title: "Claim Settlement Process", subtitle: "From filing to payout — how claims actually work", duration: "5-min read",
      sections: [
        { label: "Filing a claim", text: "Notify your insurer as soon as possible — most policies specify a time limit (e.g., 24-48 hours for motor accidents, 48 hours for health emergencies). File through the insurer's app, call center, or branch. Provide policy number, date and description of the event, and initial supporting documents." },
        { label: "Documentation required", text: "Life insurance: death certificate, policy document, claimant ID, bank details, and sometimes a post-mortem report. Health insurance: hospital bills, discharge summary, prescriptions, diagnostic reports, and pre-authorization forms. Motor insurance: FIR (for theft/accident), repair estimates, photographs of damage, and driving license." },
        { label: "Investigation & assessment", text: "The insurer assigns a surveyor or investigator to verify the claim. For health claims, the TPA (Third Party Administrator) reviews medical records. For motor claims, a surveyor assesses damage. IRDAI mandates that claims must be settled within 30 days of receiving all documents. Delayed settlement attracts interest penalties." },
        { label: "Claim Settlement Ratio (CSR)", text: "CSR is the percentage of claims an insurer settles out of total claims received. A CSR of 98% means 98 out of 100 claims were paid. Always check CSR before buying a policy — it indicates how likely your claim is to be honored. LIC leads with 98%+ CSR. Be aware: claims are mostly rejected due to non-disclosure of pre-existing conditions or policy exclusions, not insurer bad faith." },
      ]},
  ],
  "Life Insurance": [
    { title: "Surrender Value", subtitle: "What happens when you exit a policy early", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Surrender value is the money a life insurance company pays you if you end your policy before it matures. Think of it as the \"exit amount.\" You stop paying premiums, walk away, and the insurer returns a portion of what the policy is worth. It's usually less than the premiums you've paid — and the reason why is what most people miss." },
        { label: "Why it matters", text: "Endowment plans can run 15, 20, even 30 years. Life changes. For years the rules were harsh: surrender in the first year and you got nothing back. That's exactly what the 2024 reform set out to fix." },
        { label: "How it works", text: "You receive whichever is higher of two figures. The Guaranteed Surrender Value is a fixed percentage of premiums — roughly 30% in year two, rising to 90% in the final years. The Special Surrender Value is based on your paid-up value and can be higher for longer-held policies." },
        { label: "The 2024 shift", text: "From 1 October 2024, insurers must pay a surrender value even after just one full year of premiums — where before, first-year exits received zero.", callout: true },
      ]},
    { title: "Term Insurance", subtitle: "Pure protection at the lowest cost", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Term insurance is the simplest form of life insurance — pure risk cover with no savings component. If you die during the policy term, your nominee receives the full sum assured. If you survive, nothing is paid out (unless you chose a return-of-premium variant)." },
        { label: "Why it should be first", text: "A 25-year-old non-smoker can get ₹1 crore of life cover for approximately ₹700-900 per month. The same cover through an endowment plan would cost ₹35,000-45,000 per month — making term insurance nearly 50× more cost-effective for pure protection." },
        { label: "How to choose", text: "Cover should be 10-15× your annual income. Term should extend to your planned retirement age (60-65). Compare claim settlement ratios across insurers. Consider riders like critical illness cover and waiver of premium." },
      ]},
    { title: "Endowment Plans", subtitle: "Protection meets savings", duration: "3-min read",
      sections: [
        { label: "What it is", text: "An endowment plan combines life insurance with a savings component. You get a life cover during the term, and if you survive, you receive a maturity payout — the sum assured plus accumulated bonuses." },
        { label: "Participating vs Non-participating", text: "Participating plans share in the insurer's profits through bonuses — the returns aren't guaranteed but depend on the company's investment performance. Non-participating plans offer guaranteed returns but typically at lower rates." },
        { label: "Key consideration", text: "Endowment plans provide lower life cover per rupee of premium compared to term insurance. Financial planners often recommend buying term insurance separately and investing the premium difference in mutual funds for potentially higher returns." },
      ]},
    { title: "ULIPs Explained", subtitle: "Insurance + market investment in one product", duration: "5-min read",
      sections: [
        { label: "What is a ULIP", text: "A Unit-Linked Insurance Plan (ULIP) combines life insurance with market-linked investment. Your premium is split — a portion goes toward life cover and charges, while the rest is invested in equity, debt, or balanced funds of your choice. The policy value fluctuates with market performance, unlike traditional plans where returns are declared by the insurer." },
        { label: "Charges to watch", text: "ULIPs have multiple charge layers: premium allocation charge (deducted upfront, 2-5%), fund management charge (up to 1.35% per year as capped by IRDAI), mortality charge (for the life cover), policy administration charge, and switching charges. Post-2010 IRDAI reforms have significantly reduced these charges, but they still eat into returns." },
        { label: "Lock-in period", text: "ULIPs have a mandatory 5-year lock-in period — you cannot withdraw your money before this. This was introduced by IRDAI in 2010 to prevent mis-selling of ULIPs as short-term investments. After the lock-in, you can make partial withdrawals or surrender the policy." },
        { label: "ULIP vs mutual funds", text: "The classic debate: ULIPs offer life cover + investment + tax benefits under Section 80C in one product. Mutual funds (+ term insurance separately) typically deliver higher returns due to lower charges and greater flexibility. However, ULIPs allow unlimited tax-free fund switching between equity and debt, which mutual funds don't offer without tax implications." },
      ]},
    { title: "Annuity & Pension Plans", subtitle: "Building a guaranteed retirement income", duration: "4-min read",
      sections: [
        { label: "What is an annuity", text: "An annuity is a financial product that pays you a regular income (monthly, quarterly, or annually) in exchange for a lump-sum investment. It's designed for retirement — you build a corpus during your working years and convert it into guaranteed lifetime income. In India, annuities are offered by life insurance companies." },
        { label: "Types of annuities", text: "Immediate annuity: you pay a lump sum and income starts right away. Deferred annuity: you invest over years and income begins at a future date (retirement). Life annuity: payments continue until death. Joint life annuity: payments continue until both spouses die. Annuity certain: payments for a fixed period regardless of survival." },
        { label: "NPS connection", text: "The National Pension System (NPS) requires that at least 40% of the accumulated corpus at retirement be used to purchase an annuity from an IRDAI-registered insurer. The remaining 60% can be withdrawn tax-free. This makes understanding annuity options critical for every NPS subscriber." },
        { label: "Current annuity rates", text: "In India, annuity rates typically range from 6-8% per annum depending on the type, age at purchase, and market conditions. A ₹1 crore lump sum might generate ₹55,000-70,000 per month as lifetime income. Key consideration: annuity income is fully taxable as per your income slab, unlike PPF or EPF withdrawals." },
      ]},
    { title: "Riders (Add-ons)", subtitle: "Customizing your life insurance with extra coverage", duration: "4-min read",
      sections: [
        { label: "What are riders", text: "Riders are optional add-on benefits that you can attach to your base life insurance policy for extra coverage at a relatively small additional premium. Think of them as accessories for your policy — they enhance protection without requiring a separate policy. IRDAI mandates that total rider premiums cannot exceed 30% of the base premium." },
        { label: "Common life insurance riders", text: "Accidental Death Benefit: pays an additional sum assured if death occurs due to an accident. Critical Illness Rider: lump-sum payout on diagnosis of specified illnesses (cancer, heart attack, stroke, kidney failure). Waiver of Premium: if you become permanently disabled, all future premiums are waived but the policy continues. Term Rider: additional term cover on top of the base plan." },
        { label: "Health-related riders", text: "Hospital Cash Rider: pays a fixed daily amount during hospitalization. Surgical Benefit Rider: lump-sum payout for specified surgeries. Income Benefit Rider: provides regular income to the family for a specified period after the policyholder's death, in addition to the lump-sum payout." },
        { label: "Should you buy riders?", text: "Riders are almost always cheaper than buying standalone policies for the same coverage. However, riders end when the base policy ends — so if you surrender or the term expires, riders go too. Best practice: buy critical illness and accidental death riders on your term plan, and consider a standalone health policy rather than a health rider on a life policy." },
      ]},
    { title: "Group Life Insurance", subtitle: "How employers and organizations insure their people", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Group life insurance covers multiple people under a single master policy, typically arranged by an employer, bank (for loan borrowers), or association. The employer/organization is the policyholder, and employees/members are the insured lives. It's one of the most common employee benefits in India." },
        { label: "Types of group life cover", text: "Group Term Life Insurance (GTLI): pure death benefit, usually 2-3× annual salary. Group Gratuity: funds the employer's gratuity liability. Group Superannuation: pension/retirement benefit. Group Leave Encashment: covers accumulated leave payout liability. Employer-Employee Insurance: keyman insurance for critical personnel." },
        { label: "Advantages", text: "No individual medical underwriting — everyone gets covered regardless of health conditions. Premiums are significantly lower than individual policies (40-60% cheaper) due to pooled risk. Coverage starts from day one of employment. Premiums paid by the employer are a tax-deductible business expense." },
        { label: "Limitations to know", text: "Coverage ends when you leave the organization — there's no portability to your next employer. Sum assured is often insufficient (2-3× salary when financial planners recommend 10-15×). You have no control over the insurer or policy terms. Always treat group cover as supplementary and maintain your own individual term insurance policy." },
      ]},
    { title: "Actuarial Basics", subtitle: "The math behind insurance pricing", duration: "5-min read",
      sections: [
        { label: "What actuaries do", text: "Actuaries are the mathematicians of the insurance world. They use statistics, probability theory, and financial models to calculate risk, set premium rates, estimate reserves, and ensure the insurer remains solvent. Every insurance product you buy has been designed and priced by an actuary. In India, actuaries qualify through the Institute of Actuaries of India (IAI)." },
        { label: "Mortality tables", text: "Life insurance pricing starts with mortality tables — statistical records of death rates at each age. India uses the Indian Assured Lives Mortality (IALM) tables. If data shows that out of 1,00,000 30-year-old males, 150 will die before age 31, the pure risk premium for ₹1 crore cover is ₹15,000. Actual premiums add loadings for expenses, profit margin, and contingencies." },
        { label: "Key actuarial concepts", text: "Law of Large Numbers: the more policies in the pool, the more predictable the actual claims will be. Present Value: future payouts are discounted to today's value using interest rates. Expected Value: probability of an event × its financial impact = the average cost per policy. Loading: the extra amount added to the pure premium to cover expenses and profit." },
        { label: "Why premiums differ", text: "A 25-year-old pays less than a 45-year-old because mortality rates are lower. Smokers pay 50-80% more because smoking doubles mortality risk. Women often pay less for life insurance (longer life expectancy) but more for health insurance (higher hospitalization rates in certain age groups). Location matters too — metro residents may face different risk profiles than rural populations." },
      ]},
  ],
  "Health Insurance": [
    { title: "Cashless vs Reimbursement", subtitle: "Two ways to claim — one is far easier", duration: "3-min read",
      sections: [
        { label: "Cashless claims", text: "At network hospitals, your insurer pays the hospital directly. You only pay the portion not covered by your policy. Requires pre-authorization — inform your insurer or TPA before admission (or within a few hours for emergencies)." },
        { label: "Reimbursement claims", text: "At non-network hospitals, you pay the full bill first and then submit documents to your insurer for reimbursement. This process can take 15-30 days and requires preserving all original bills, prescriptions, and discharge summaries." },
        { label: "Pro tip", text: "Always check if your preferred hospital is in your insurer's network before admission. Network lists can change — verify directly with the insurer or TPA, not just the hospital." },
      ]},
    { title: "Waiting Periods", subtitle: "Why your new policy won't cover everything immediately", duration: "3-min read",
      sections: [
        { label: "Initial waiting period", text: "Most health policies have a 30-day initial waiting period (except for accidents). No claims are payable during this window. This prevents people from buying insurance only when they know they're about to be hospitalized." },
        { label: "Pre-existing disease waiting", text: "Conditions you had before buying the policy are typically covered only after 2-4 years of continuous coverage. IRDAI has capped this at a maximum of 4 years." },
        { label: "Specific disease waiting", text: "Some conditions like cataracts, hernia, and joint replacement have a separate 1-2 year waiting period, even if you didn't have them before buying the policy." },
      ]},
    { title: "Family Floater vs Individual Plans", subtitle: "Covering the whole family — which way works better", duration: "3-min read",
      sections: [
        { label: "Family floater", text: "One policy covers the entire family with a shared sum insured. More affordable than individual plans for each member. However, one large claim can exhaust the cover for everyone else." },
        { label: "Individual plans", text: "Separate policies for each family member. More expensive but each person has their own dedicated sum insured. Ideal when family members have very different risk profiles (age, health conditions)." },
        { label: "Best practice", text: "Many advisors recommend a base family floater plus a super top-up policy. The floater covers routine claims, and the super top-up provides additional cover (at low cost) for expensive hospitalizations." },
      ]},
    { title: "Top-Up & Super Top-Up Plans", subtitle: "Affordable way to boost your health cover", duration: "4-min read",
      sections: [
        { label: "Why you need more cover", text: "A ₹5 lakh health policy may seem adequate, but a single cardiac surgery or cancer treatment can cost ₹10-25 lakh in a metro hospital. Rather than buying a high base cover (which is expensive), you can add a top-up or super top-up at a fraction of the cost to extend your protection." },
        { label: "Top-Up plans", text: "A top-up kicks in when a single hospitalization bill exceeds a threshold (called the 'deductible'). If your deductible is ₹5 lakh, the top-up pays only when one bill crosses ₹5 lakh. Important limitation: each claim is evaluated independently — three hospitalizations of ₹3 lakh each won't trigger a top-up with a ₹5 lakh deductible, even though the total is ₹9 lakh." },
        { label: "Super Top-Up plans", text: "A super top-up is smarter — it aggregates all claims in a policy year. If your deductible is ₹5 lakh and you have three claims of ₹3 lakh each (total ₹9 lakh), the super top-up pays ₹4 lakh (₹9 lakh minus ₹5 lakh deductible). This makes super top-ups far more useful than basic top-ups." },
        { label: "Cost comparison", text: "A ₹50 lakh super top-up with a ₹5 lakh deductible costs roughly ₹3,000-5,000 per year for a 30-year-old — compared to ₹25,000-35,000 for a base ₹50 lakh policy. Strategy: buy a ₹5 lakh base policy from your preferred insurer + a ₹50 lakh super top-up, and you get ₹55 lakh total cover at a much lower premium." },
      ]},
    { title: "Critical Illness vs Comprehensive Cover", subtitle: "Two different approaches to health protection", duration: "4-min read",
      sections: [
        { label: "Comprehensive health cover", text: "Standard health insurance (also called indemnity plans) reimburses actual hospital bills up to the sum insured. It covers any illness or injury requiring hospitalization. You submit bills, and the insurer pays actual expenses incurred — it's expense-based, not diagnosis-based." },
        { label: "Critical illness cover", text: "Critical illness insurance pays a fixed lump sum on diagnosis of specified serious diseases — cancer, heart attack, stroke, kidney failure, organ transplant, etc. It doesn't matter what your treatment costs — if diagnosed, you receive the full sum assured (e.g., ₹25 lakh) as a one-time payment. You can use this money however you wish." },
        { label: "Key differences", text: "Comprehensive plans: cover any hospitalization, pay actual bills, require documentation. Critical illness: cover only listed diseases (typically 20-40), pay a fixed lump sum, require only diagnosis proof. Comprehensive plans have copays, sub-limits, and room rent caps; critical illness has none — it's a clean payout." },
        { label: "Which to choose", text: "Don't choose — buy both. A comprehensive plan handles everyday hospitalizations (appendicitis, fractures, infections). A critical illness plan provides the lump sum needed for major life-disrupting diseases where you may not be able to work for months. The critical illness payout covers income loss, lifestyle modifications, home care, and travel for treatment that standard health insurance doesn't." },
      ]},
    { title: "Ayushman Bharat (PMJAY)", subtitle: "India's ambitious public health insurance scheme", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Pradhan Mantri Jan Arogya Yojana (PMJAY), the flagship scheme under Ayushman Bharat, is the world's largest government-funded health insurance program. It provides ₹5 lakh per family per year for secondary and tertiary hospitalization to over 55 crore beneficiaries from economically weaker sections — roughly 40% of India's population." },
        { label: "How it works", text: "Eligible families are identified from the SECC (Socio-Economic Caste Census) database. No premium is paid by beneficiaries — the government funds it entirely. Coverage includes 3 days of pre-hospitalization and 15 days of post-hospitalization expenses. Over 1,950 treatment packages are covered across 27 specialties." },
        { label: "Impact and scale", text: "Since its 2018 launch, PMJAY has issued over 30 crore Ayushman cards and authorized over 7 crore hospital treatments. It has empaneled 30,000+ hospitals (both public and private). The scheme has been a game-changer in tier-2 and tier-3 cities where private hospital utilization by low-income families has surged." },
        { label: "Industry implications", text: "For the insurance industry, PMJAY has expanded the awareness of health insurance among populations that had never interacted with formal insurance. It has created infrastructure (hospital empanelment, digital claims) that private insurers can leverage. However, low reimbursement rates under PMJAY remain a challenge — many private hospitals find the package rates commercially unviable." },
      ]},
    { title: "Group Health Insurance", subtitle: "How employer-sponsored health cover works", duration: "4-min read",
      sections: [
        { label: "What it is", text: "Group health insurance (GMC — Group Mediclaim) is a health policy purchased by an employer for its employees and often their dependents. It's the most common employee benefit in India's formal sector. The employer pays the premium, and all employees get covered under a single master policy from day one of joining." },
        { label: "Key features", text: "No waiting periods for pre-existing diseases (unlike individual policies that impose 2-4 year waits). No medical tests required for enrollment. Coverage typically includes hospitalization, daycare procedures, maternity benefits, and sometimes OPD. Sum insured usually ranges from ₹3-10 lakh per employee, with some top companies offering ₹25 lakh+." },
        { label: "Group vs individual plans", text: "Group plans are cheaper per person, have no waiting periods, and cover pre-existing conditions from day one. However, coverage ends when you leave the job, sum insured may be insufficient, and you have no say in the insurer or policy terms. Individual plans are portable, lifelong renewable, and customizable." },
        { label: "Best practice", text: "Treat your employer's group health cover as a bonus, not your primary health protection. Buy your own individual health policy early (when you're young and healthy, premiums are low) and maintain it throughout your career. This way, job changes don't leave you uninsured, and you build continuous coverage that reduces waiting periods over time." },
      ]},
    { title: "Health Insurance Portability", subtitle: "Switch insurers without losing your benefits", duration: "3-min read",
      sections: [
        { label: "What is portability", text: "Health insurance portability allows you to switch from one insurer to another without losing the credit for the waiting periods you've already served. Introduced by IRDAI in 2011, it means that if you've completed 2 years of waiting for a pre-existing condition with Insurer A, Insurer B must give you credit for those 2 years." },
        { label: "How to port", text: "Apply to the new insurer at least 45 days before your existing policy's renewal date. The new insurer will request your claims history from the old insurer. They may accept, reject, or modify terms (like loading a higher premium). Portability is your right, but the new insurer is not obligated to accept you at standard rates." },
        { label: "What transfers", text: "Waiting period credits transfer — this is the core benefit. No-claim bonus may or may not transfer depending on the new insurer's policy. Coverage amount can be increased or maintained. You can also port between different product types (e.g., from a basic plan to a comprehensive one)." },
        { label: "Common mistakes", text: "Don't let your current policy lapse before porting — that breaks continuity and resets all waiting periods. Don't apply too late — the 45-day advance requirement is strict. Don't assume the new insurer will match your current terms — they can underwrite you afresh. Always compare the new policy's features, network hospitals, and claim settlement experience before porting." },
      ]},
  ],
  "General Insurance": [
    { title: "Motor Insurance Basics", subtitle: "Third party vs own damage — and why you need both", duration: "4-min read",
      sections: [
        { label: "Third Party (TP)", text: "Mandatory by law. Covers your legal liability if your vehicle causes injury, death, or property damage to someone else. Does NOT cover damage to your own vehicle. Premiums are fixed by IRDAI." },
        { label: "Own Damage (OD)", text: "Covers damage to your own vehicle from accidents, theft, fire, floods, and vandalism. Premiums vary by insurer based on the vehicle's IDV (Insured Declared Value), make, model, location, and your claims history." },
        { label: "Comprehensive", text: "Combines TP and OD in a single policy. This is what most vehicle owners should choose. Add-ons like zero depreciation, engine protection, and roadside assistance provide even better coverage." },
      ]},
    { title: "Home Insurance", subtitle: "Protecting your biggest asset", duration: "3-min read",
      sections: [
        { label: "What it covers", text: "Home insurance protects the structure of your house and/or its contents against fire, natural disasters, theft, and other perils. Some policies also cover temporary accommodation costs if your home becomes uninhabitable." },
        { label: "Structure vs contents", text: "Structure cover protects walls, roof, foundation, and permanent fixtures. Contents cover protects furniture, electronics, appliances, and personal belongings. You can buy either or both." },
        { label: "Why it's underused", text: "India's home insurance penetration is extremely low — less than 1% of homes are insured. Yet natural disasters like floods, earthquakes, and cyclones affect millions of Indian homes annually." },
      ]},
    { title: "Third-Party vs Comprehensive Motor", subtitle: "Choosing the right vehicle insurance", duration: "4-min read",
      sections: [
        { label: "Third-Party only", text: "Third-party (TP) motor insurance is the bare legal minimum under the Motor Vehicles Act. It covers your liability if your vehicle injures someone, causes death, or damages someone else's property. It does NOT cover damage to your own vehicle. Premiums are fixed by IRDAI — you cannot negotiate them, and they're the same across all insurers." },
        { label: "Comprehensive cover", text: "Comprehensive insurance = TP liability + Own Damage (OD). The OD component covers your vehicle against accidents, theft, fire, floods, riots, and natural disasters. Unlike TP, OD premiums vary by insurer, allowing you to compare and negotiate. The OD premium is based on your vehicle's IDV (Insured Declared Value — basically the current market value)." },
        { label: "No Claim Bonus (NCB)", text: "NCB is your reward for not making claims. It's a discount on your OD premium that grows each claim-free year: 20% after year 1, 25% after year 2, up to 50% after 5 claim-free years. NCB belongs to the owner, not the vehicle — it transfers when you buy a new car. Making even one small claim resets it to zero, so weigh small repairs vs losing your NCB." },
        { label: "Add-ons worth considering", text: "Zero Depreciation: insurer pays full repair cost without deducting for depreciation of parts (critical for new cars). Engine Protection: covers engine damage from water logging (essential in flood-prone cities). Return to Invoice (RTI): in case of total loss, you get the invoice value rather than depreciated IDV. Roadside Assistance: towing, battery jump-start, flat tire help." },
      ]},
    { title: "Crop Insurance (PMFBY)", subtitle: "Protecting India's farmers from nature's uncertainty", duration: "4-min read",
      sections: [
        { label: "What is PMFBY", text: "Pradhan Mantri Fasal Bima Yojana (PMFBY), launched in 2016, is the Indian government's flagship crop insurance scheme. It protects farmers against crop loss or damage due to natural calamities, pests, and diseases. The scheme covers all food crops, oilseeds, commercial, and horticultural crops." },
        { label: "Premium structure", text: "Farmer premiums are kept extremely low: 2% for Kharif crops, 1.5% for Rabi crops, and 5% for commercial/horticultural crops. The actual actuarial premium can be 15-20% — the massive difference is subsidized equally by central and state governments. This makes it one of the most heavily subsidized insurance programs globally." },
        { label: "How claims work", text: "Claims are triggered by area-based yield estimation, not individual farm assessment. Government-mandated Crop Cutting Experiments (CCEs) determine the average yield for a defined area. If actual yield falls below the threshold yield (based on 7-year average), all insured farmers in that area receive compensation proportionally." },
        { label: "Challenges and reforms", text: "PMFBY was made voluntary for farmers in 2020 (earlier it was mandatory for crop loan borrowers). Claim settlement delays remain a concern — states often delay their premium subsidy share. Technology adoption (satellite imaging, drones, weather stations) is improving assessment accuracy. The scheme covers over 5.5 crore farmer applications annually, making it the world's largest crop insurance program by enrollment." },
      ]},
    { title: "Travel Insurance", subtitle: "Essential protection for domestic and international travel", duration: "4-min read",
      sections: [
        { label: "What it covers", text: "Travel insurance provides financial protection against unexpected events during trips: medical emergencies abroad, trip cancellation/interruption, lost or delayed baggage, passport loss, flight delays, and personal liability. For international travel, medical cover is the most critical component — healthcare costs in the US, Europe, or Southeast Asia can be devastating without insurance." },
        { label: "Domestic vs international", text: "Domestic travel insurance covers trip cancellation, baggage loss, personal accident, and hotel burglary — but medical expenses are usually handled by your regular health policy. International travel insurance is far more important: it covers overseas medical treatment (₹50 lakh to ₹1 crore), emergency evacuation, repatriation of remains, and is mandatory for Schengen visa applications (minimum €30,000 cover)." },
        { label: "Key features to compare", text: "Medical cover limit (go for at least $50,000 for Southeast Asia, $100,000 for US/Europe). Cashless hospitalization network abroad. Coverage for pre-existing conditions (most policies exclude them). Adventure sports cover (if you plan trekking, scuba, skiing). COVID-19 coverage. Deductible amounts. Emergency dental treatment cover." },
        { label: "Claims tips", text: "Carry your policy documents and insurer's 24/7 helpline number. Notify the insurer immediately in case of medical emergency. For baggage claims, get a Property Irregularity Report (PIR) from the airline within 21 days. Keep all receipts for emergency purchases made due to baggage delay. File claims within the policy-specified window (usually 30 days of return)." },
      ]},
    { title: "Fire & Marine Insurance", subtitle: "Commercial insurance pillars every BFSI professional should know", duration: "4-min read",
      sections: [

        { label: "A–C", text: "Actuary: The mathematician who calculates insurance risks and premiums. Adverse Selection: When higher-risk individuals are more likely to buy insurance, skewing the risk pool. Annuity: Regular income payments, usually post-retirement. Assignment: Transferring policy rights to another person. Bancassurance: Sale of insurance products through bank channels. BIMA Sugam: IRDAI's proposed unified digital insurance platform. Broker: Licensed intermediary who represents the buyer, not the insurer. Catastrophe Bond (Cat Bond): Security that transfers catastrophe risk to capital markets. Claim Ratio/Incurred Claim Ratio: Claims paid as percentage of premiums earned. Co-payment/Co-pay: The percentage of a claim amount you must pay yourself. Combined Ratio: Sum of loss ratio and expense ratio — below 100% means underwriting profit. Commutation: Settlement of all future obligations with a single lump-sum payment." },

        { label: "N–S", text: "Paid-up Value: Reduced cover if you stop paying premiums but don't surrender. Peril: The specific cause of loss (fire, flood, theft, death). Persistency Ratio: Percentage of policies still active after a given period — measures customer retention. Premium: The price of insurance coverage. Proposal Form: Application form for insurance — misstatements here can void claims. Reinstatement: Reviving a lapsed policy, usually requiring back premiums and medical examination. Reinsurance: Insurance for insurance companies — transfers risk from primary insurer to reinsurer. Rider: Optional add-on coverage (accidental death, critical illness, waiver of premium). Risk Pooling: Core insurance principle — many contribute small amounts so few who suffer losses can be compensated. Solvency Ratio: Insurer's available capital vs required capital — IRDAI minimum is 150%. Subrogation: Insurer's right to pursue the party that caused the insured loss to recover the claim amount paid. Sum Assured: The guaranteed payout amount specified in the policy. Surrender Value: Amount received on early policy exit — GSV or Special SV, whichever is higher." },

      ]},

// ── API ──
async function fetchNews(tag, search) {
  let url = `${API_BASE}/api/news?limit=30`;
  if (tag && tag !== 'All') url += `&tag=${encodeURIComponent(tag)}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.articles || [];
  } catch (e) { return []; }
}

async function fetchTags() {
  try {
    const res = await fetch(`${API_BASE}/api/tags`);
    const data = await res.json();
    return data.tags || [];
  } catch (e) { return []; }
}

// ── Concept text rendering ──
function renderConceptText(text) {
  const keys = Object.keys(CONCEPTS).sort((a, b) => b.length - a.length);
  let html = '', remaining = text, guard = 0;
  while (remaining.length && guard < 500) {
    guard++;
    let hitIdx = -1, hitKey = null;
    for (const k of keys) {
      const i = remaining.toLowerCase().indexOf(k);
      if (i !== -1 && (hitIdx === -1 || i < hitIdx)) { hitIdx = i; hitKey = k; }
    }
    if (hitIdx === -1) { html += esc(remaining); break; }
    if (hitIdx > 0) html += esc(remaining.slice(0, hitIdx));
    html += `<button class="concept-chip" onclick="openConcept('${hitKey}')">${esc(remaining.slice(hitIdx, hitIdx + hitKey.length))}</button>`;
    remaining = remaining.slice(hitIdx + hitKey.length);
  }
  return html;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Render: Lesson ──
function renderLesson(trackName, lessonIndex) {
  const track = LESSONS[trackName];
  if (!track || !track[lessonIndex]) return;
  const lesson = track[lessonIndex];
  const area = document.getElementById('scrollArea');

  const sectionsHtml = lesson.sections.map(s => {
    if (s.callout) {
      return `<div class="callout"><div class="callout-title">${s.label}</div><div class="callout-body">${renderConceptText(s.text)}</div></div>`;
    }
    return `<div class="section-label${s.label.toLowerCase().includes('matter') || s.label.toLowerCase().includes('tip') || s.label.toLowerCase().includes('consider') || s.label.toLowerCase().includes('insight') ? ' accent' : ''}">${s.label}</div><p class="body-text">${renderConceptText(s.text)}</p>`;
  }).join('');

  // Navigation between lessons
  const prevBtn = lessonIndex > 0
    ? `<button class="action-btn" onclick="openLesson('${esc(trackName)}', ${lessonIndex - 1})">← Previous</button>` : '';
  const nextBtn = lessonIndex < track.length - 1
    ? `<button class="action-btn" onclick="openLesson('${esc(trackName)}', ${lessonIndex + 1})">Next →</button>` : '';

  area.innerHTML = `
    <div style="padding:0 0 40px">
      <div style="padding:14px 0 0">
        <button class="back-btn" onclick="navigate('pathshala')">← Pathshala</button>
      </div>

// ── Navigation ──
let currentTrack = null;
let currentLessonIdx = 0;

function navigate(screen) {
  const area = document.getElementById('scrollArea');
  scrollPositions[currentScreen] = window.scrollY;
  currentScreen = screen;
  render();
  window.scrollTo(0, scrollPositions[screen] || 0);
  updateTabs();
}

function switchTab(tab) {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  if (tab === 'briefing') { activeTag = 'All'; navigate('briefing'); }
  else if (tab === 'pathshala') navigate('pathshala');
  else if (tab === 'companies') navigate('companies');
  else if (tab === 'regs') navigate('regs');
  else if (tab === 'more') navigate('more');
}

function filterByTag(tag) { activeTag = tag; navigate('briefing'); }
function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim();
  clearTimeout(handleSearch._t);
  handleSearch._t = setTimeout(() => { if (currentScreen === 'briefing') renderBriefing(); }, 350);
}

function openArticle(idx) { selectedArticle = idx; navigate('article-detail'); }

function openTrack(name) { currentTrack = name; navigate('track'); }
function openLesson(trackName, idx) {
  currentTrack = trackName;
  currentLessonIdx = idx;
  navigate('lesson');
}
function openLessonFor(conceptKey) {
  const c = CONCEPTS[conceptKey];
  if (!c || !c.track) { navigate('pathshala'); return; }
  openTrack(c.track);
}

function render() {
  switch (currentScreen) {
    case 'briefing': renderBriefing(); break;
    case 'article-detail': renderArticle(liveArticles[selectedArticle]); break;
    case 'pathshala': renderPathshala(); break;
    case 'track': renderTrack(currentTrack); break;
    case 'lesson': renderLesson(currentTrack, currentLessonIdx); break;
    case 'companies': renderComingSoon('Companies', '🏢', 'Detailed profiles of Indian insurance companies with financials, claim data, and product comparisons are on the way. Stay tuned!'); break;
    case 'regs': renderComingSoon('Regulatory Updates', '📋', 'A curated tracker of IRDAI regulations, circulars, and reform updates is being built. Launching soon!'); break;
    case 'more': renderComingSoon('More Features', '⚙️', 'Bookmarks, reading history, dark mode, and notification settings are in development. We\'ll have them ready soon!'); break;
    default: renderComingSoon('Coming Soon', '🚀', 'This feature is being crafted for you. Check back soon!');
  }
}

function updateTabs() {
  const map = {
    'article-detail': 'briefing', 'briefing': 'briefing',
    'lesson': 'pathshala', 'track': 'pathshala', 'pathshala': 'pathshala',
  };
  const activeTabId = map[currentScreen] || currentScreen;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === activeTabId);
  });
}

// ── Sheet ──
function openConcept(key) {
  const c = CONCEPTS[key];
  if (!c) return;
  lastOpenedConcept = key;
  document.getElementById('sheetTerm').textContent = c.term;
  document.getElementById('sheetBody').textContent = c.micro;
  document.getElementById('sheetOverlay').style.display = 'block';
  document.getElementById('sheet').style.display = 'block';
  requestAnimationFrame(() => {
    document.getElementById('sheetOverlay').classList.add('visible');
    document.getElementById('sheet').classList.add('open');
  });
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('visible');
  document.getElementById('sheet').classList.remove('open');
  setTimeout(() => {
    document.getElementById('sheetOverlay').style.display = 'none';
    document.getElementById('sheet').style.display = 'none';
  }, 240);
}

// ── Save & Share ──
function toggleSave(btn, title) {
  if (savedArticles.has(title)) {
    savedArticles.delete(title);
    btn.textContent = '♡ Save';
    btn.classList.remove('saved');
  } else {
    savedArticles.add(title);
    btn.textContent = '♥ Saved';
    btn.classList.add('saved');
  }
}

function shareArticle() {
  const article = liveArticles[selectedArticle];
  if (!article) return;
  if (navigator.share) {
    navigator.share({ title: article.title, text: article.dek, url: article.link !== '#' ? article.link : window.location.href });
  } else {
    const text = `${article.title}\n\n${article.dek}\n\nRead more on InsuralIQ`;
    navigator.clipboard.writeText(text).then(() => alert('Article link copied to clipboard!'));
  }
}

// ── Init ──
renderBriefing();
